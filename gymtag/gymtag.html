                    </div>
                    <div class="ed-link">${it.mid
                    ? `<span class="tagchip">${I('nfc')}${M[it.mid].tag}</span><button class="linkbtn" onclick="openSheet('link',${i})">Trocar máquina</button>`
                    : `<button class="linkbtn warn" onclick="openSheet('link',${i})">${I('link')}Vincular a uma máquina</button>`}
                    </div>
                    <div class="ed-fields">
                        <label>Séries<input class="num" type="number" value="${it.sets}" onchange="edSet(${i},'sets',this.value)"></label>
                        <label>Reps<input class="num" type="number" value="${it.reps}" onchange="edSet(${i},'reps',this.value)"></label>
                        <label>Carga (${S.unit})<input class="num" type="number" value="${toU(it.w)}" onchange="edSet(${i},'w',this.value)"></label>
                    </div>
                </div>`).join('')}
                <button class="add-card" onclick="openSheet('add')">${I('plus')}Adicionar exercício</button>
                <div class="br"><button class="btn bp" onclick="savePlan()">${I('check')}Salvar treino</button></div>`;
        }

        function edSet(i, k, v) { S.draft.items[i][k] = k === 'w' ? fromU(v) : Math.max(1, parseInt(v) || 1); }
        function edRemove(i) { S.draft.items.splice(i, 1); renderEdit(); }

        function savePlan() {
            const d = S.draft;
            d.name = d.name.trim();
            if (!d.name) { toast('⚠️ Dê um nome ao treino'); return; }
            if (!d.items.length) { toast('⚠️ Adicione ao menos um exercício'); return; }
            if (!d.focus.trim()) d.focus = [...new Set(d.items.map(it => CATS[exCat(it)].l))].join(' + ');
            PLANS[PLANS.findIndex(p => p.id === d.id)] = d;
            S.viewPlan = d.id; S.planTab = 'me'; S.draft = null;
            const g = progOf(d.id), next = g.ids.map(planOf).find(p => !p.items.length);
            toast('💾 ' + d.name + ' salvo' + (next ? ' — falta montar o ' + next.name : ''));
            goBack();
        }

        // ── SHEET: adicionar / vincular exercício ───────────────
        function openSheet(mode, i) {
            S.sheet = { mode, i, q: '', cat: 'all', busy: false };
            renderSheet();
            $('sheet').classList.add('on'); $('sheet-bg').classList.add('on');
        }
        function closeSheet() { $('sheet').classList.remove('on'); $('sheet-bg').classList.remove('on'); }

        function renderSheet() {
            const sh = S.sheet, add = sh.mode === 'add';
            const target = !add && S.draft.items[sh.i];
            $('sheet-body').innerHTML = `
                <div class="hdr-sub" style="padding-top:6px">
                    <h1>${add ? 'Adicionar exercício' : 'Vincular máquina'}</h1>
                    <button class="icon-btn sm" onclick="closeSheet()" aria-label="Fechar">${I('x')}</button>
                </div>
                ${target ? `<div class="slabel hint" style="margin-top:-4px">para <b style="color:var(--ink)">${exName(target)}</b></div>` : ''}
                <div class="nfc-opt${sh.busy ? ' busy' : ''}" onclick="sheetScan()">
                    <div class="tile">${I('nfc')}</div>
                    <div><b>${sh.busy ? 'Lendo tag NFC...' : 'Aproximar da máquina'}</b><span>${sh.busy ? 'Mantenha o celular na tag' : 'Lê a tag e vincula o equipamento'}</span></div>
                </div>
                <div class="slabel" style="margin-top:6px">ou escolha no catálogo</div>
                <div class="search">${I('search')}<input class="inp" placeholder="Buscar máquina" value="${sh.q}" oninput="S.sheet.q=this.value;renderSheetList()"></div>
                <div class="filter-row">${['all', 'chest', 'back', 'legs', 'shoulder', 'arms'].map(c => `<button class="fc${sh.cat === c ? ' on' : ''}" onclick="S.sheet.cat='${c}';renderSheet()">${c === 'all' ? 'Todas' : CATS[c].l}</button>`).join('')}</div>
                <div class="list" id="sheet-list"></div>
                ${add ? `<div class="slabel">exercício livre <small>sem máquina</small></div>
                <div class="free-row"><input class="inp" id="free-name" placeholder="Ex.: Prancha, Flexão"><button class="btn bp" onclick="addFree()">${I('plus')}</button></div>` : ''}`;
            renderSheetList();
        }

        function renderSheetList() {
            const sh = S.sheet, q = sh.q.trim().toLowerCase(), inDraft = new Set(S.draft.items.map(it => it.mid));
            const list = MACHINES.filter(m => (sh.cat === 'all' || m.cat === sh.cat) && (!q || (m.name + ' ' + m.muscle).toLowerCase().includes(q)));
            $('sheet-list').innerHTML = list.length ? list.map(m => `
                <div class="lrow" onclick="chooseMachine('${m.id}')">${tile(m)}
                    <div class="lbody"><div class="lname">${m.name}${inDraft.has(m.id) ? '<span class="chip">No treino</span>' : ''}</div><div class="lmeta">${m.muscle}</div></div>
                    <span class="tagchip">${M[m.id].tag.slice(-3)}</span>
                </div>`).join('') : '<div class="empty-sm">Nenhuma máquina encontrada</div>';
        }

        function sheetScan() {
            const sh = S.sheet; if (sh.busy) return;
            sh.busy = true; renderSheet();
            setTimeout(() => {
                const inDraft = new Set(S.draft.items.map(it => it.mid));
                const m = MACHINES.find(x => !inDraft.has(x.id)) || MACHINES[0];
                chooseMachine(m.id, true);
            }, 1500);
        }

        function chooseMachine(mid, viaTag) {
            const d = S.draft, sh = S.sheet, l = lastOf(mid);
            const w = l ? Math.max(...l.sets.map(s => s.w)) : 20;
            if (sh.mode === 'add') d.items.push({ mid, sets: 3, reps: 10, w });
            else { const it = d.items[sh.i]; d.items[sh.i] = { mid, sets: it.sets, reps: it.reps, w: it.w || w }; }
            closeSheet(); renderEdit();
            toast((viaTag ? '📡 ' + M[mid].tag + ' · ' : sh.mode === 'add' ? '➕ ' : '🔗 ') + M[mid].name + (sh.mode === 'add' ? ' adicionado' : ' vinculado'));
        }

        function addFree() {
            const v = $('free-name').value.trim();
            if (!v) { toast('Digite o nome do exercício'); return; }
            S.draft.items.push({ mid: null, name: v, cat: 'core', sets: 3, reps: 12, w: 0 });
            closeSheet(); renderEdit();
        }

        // ── EVOLUÇÃO ─────────────────────────────────────────────
        const SEQ = ['#efeaf9', '#d9ccfa', '#a98af0', '#6c3ce0'];   // sequencial: um matiz, claro → escuro
        const compact = v => v >= 1000 ? fmt(v / 1000) + 'k' : fmt(v, 0);
        function niceMax(m) { const p = 10 ** Math.floor(Math.log10(m)), f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
        const topRounded = (x, y, w, h, r) => { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
        const periodStart = () => { const s = weekStart(new Date()); s.setDate(s.getDate() - 7 * (S.period - 1)); return s; };

        function weeksData(n) {
            const ws = weekStart(new Date()), out = [];
            for (let i = n - 1; i >= 0; i--) {
                const s = new Date(ws); s.setDate(s.getDate() - 7 * i);
                const e = new Date(s); e.setDate(e.getDate() + 7);
                const ss = S.history.filter(x => x.date >= s && x.date < e);
                out.push({ start: s, vol: sum(ss, x => sum(x.exercises, ex => vol(ex.sets))), n: ss.length });
            }
            return out;
        }

        function barChart(weeks) {
            const VW = 287, H = 150, pl = 30, pt = 8, pb = 20, pw = VW - pl, ph = H - pt - pb;
            const top = niceMax(Math.max(1, ...weeks.map(w => toU(w.vol))));
            const n = weeks.length, slot = pw / n, bw = Math.min(26, slot - 6);
            let s = `<svg class="chart" viewBox="0 0 ${VW} ${H}" role="img" aria-label="Volume por semana">
                <defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c13cb4"/><stop offset="1" stop-color="#6c3ce0"/></linearGradient></defs>`;
            [0, .5, 1].forEach(f => {
                const y = pt + ph * (1 - f);
                s += `<line class="grid" x1="${pl}" x2="${VW}" y1="${y}" y2="${y}"/><text class="ax" x="${pl - 6}" y="${y + 3}" text-anchor="end">${compact(top * f)}</text>`;
            });
            weeks.forEach((w, i) => {
                const v = toU(w.vol), h = v ? Math.max(4, v / top * ph) : 0;
                const x = pl + slot * i + (slot - bw) / 2, y = pt + ph - h, cur = i === n - 1;
                s += `<rect class="hit" x="${pl + slot * i}" y="${pt}" width="${slot}" height="${ph}" rx="6" data-tip="Semana de ${pad(w.start.getDate())}/${pad(w.start.getMonth() + 1)}|${VOL(w.vol)} · ${w.n} treino${w.n === 1 ? '' : 's'}"/>`;
                if (h) s += `<path d="${topRounded(x, y, bw, h, 4)}" fill="${cur ? 'url(#gbar)' : '#d9ccfa'}" pointer-events="none"/>`;
                if (n <= 6 || (n - 1 - i) % 2 === 0) s += `<text class="ax" x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${pad(w.start.getDate())}/${pad(w.start.getMonth() + 1)}</text>`;
            });
            return s + '</svg>';
        }

        function heatmap(n) {
            const today = sod(new Date()), first = weekStart(today);
            first.setDate(first.getDate() - 7 * (n - 1));
            const byDay = {};
            S.history.forEach(s => { (byDay[dayKey(s.date)] = byDay[dayKey(s.date)] || []).push(s); });
            const dv = a => sum(a, s => sum(s.exercises, e => vol(e.sets)));
            const max = Math.max(1, ...Object.values(byDay).map(dv));
            const pl = 28, cs = Math.min(30, (287 - pl) / n), sz = cs - 3, H = 7 * cs;
            let s = `<svg class="chart" viewBox="0 0 ${pl + n * cs} ${H}" style="max-width:${pl + n * cs}px" role="img" aria-label="Dias treinados">`;
            [[0, 'Seg'], [2, 'Qua'], [4, 'Sex'], [6, 'Dom']].forEach(([r, l]) => { s += `<text class="ax" x="0" y="${r * cs + sz / 2 + 3}">${l}</text>`; });
            for (let c = 0; c < n; c++) for (let r = 0; r < 7; r++) {
                const d = new Date(first); d.setDate(d.getDate() + c * 7 + r);
                const x = pl + c * cs, y = r * cs;
                if (d > today) { s += `<rect x="${x + .5}" y="${y + .5}" width="${sz - 1}" height="${sz - 1}" rx="4" fill="none" stroke="#e7e1f3" stroke-dasharray="2 2"/>`; continue; }
                const a = byDay[dayKey(d)], v = a ? dv(a) : 0, lv = !v ? 0 : v / max < .55 ? 1 : v / max < .8 ? 2 : 3;
                const tip = fdate(d) + '|' + (a ? a.map(x => x.planName).join(', ') + ' · ' + VOL(v) : 'Sem treino');
                s += `<rect class="cell" x="${x}" y="${y}" width="${sz}" height="${sz}" rx="4" fill="${SEQ[lv]}"${sameDay(d, today) ? ' stroke="#1b1530" stroke-width="1.5"' : ''} data-tip="${tip}"/>`;
            }
            return s + '</svg>';
        }

        // Carga máxima por sessão de um exercício, com crosshair no hover
        let LC = null;
        function lineChart(key) {
            const since = periodStart();
            const pts = S.history.filter(s => s.date >= since).slice().reverse().map(s => {
                const e = s.exercises.find(x => exKey(x) === key); if (!e) return null;
                const w = Math.max(...e.sets.map(x => x.w));
                return { d: s.date, w, r: e.sets.find(x => x.w === w).r, pr: e.sets.some(x => x.pr) };
            }).filter(Boolean);
            if (pts.length < 2) { LC = null; return '<div class="empty-sm">Poucas sessões deste exercício no período</div>'; }
            const VW = 287, H = 150, pl = 30, pr = 8, pt = 10, pb = 20, pw = VW - pl - pr, ph = H - pt - pb;
            const ys = pts.map(p => toU(p.w)), lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 5;
            const y0 = lo - span * .25, y1 = hi + span * .25;
            const X = i => pl + pw * i / (pts.length - 1), Y = v => pt + ph * (1 - (v - y0) / (y1 - y0));
            const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(toU(p.w)).toFixed(1)).join('');
            LC = { pts, X, Y, VW, pl, pw };
            let s = `<svg class="chart" id="lc" viewBox="0 0 ${VW} ${H}" role="img" aria-label="Evolução de carga">
                <defs><linearGradient id="garea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c3ce0" stop-opacity=".18"/><stop offset="1" stop-color="#6c3ce0" stop-opacity="0"/></linearGradient></defs>`;
            [0, .5, 1].forEach(f => {
                const v = y0 + (y1 - y0) * f, y = Y(v);
                s += `<line class="grid" x1="${pl}" x2="${VW}" y1="${y}" y2="${y}"/><text class="ax" x="${pl - 6}" y="${y + 3}" text-anchor="end">${fmt(v, 0)}</text>`;
            });
            s += `<path d="${line}L${X(pts.length - 1)},${pt + ph}L${pl},${pt + ph}Z" fill="url(#garea)"/>`
                + `<path d="${line}" fill="none" stroke="#6c3ce0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
                + `<line id="lc-x" y1="${pt}" y2="${pt + ph}" stroke="#1b1530" stroke-opacity=".25" stroke-dasharray="3 3" visibility="hidden"/>`;
            pts.forEach((p, i) => {
                s += p.pr
                    ? `<circle cx="${X(i)}" cy="${Y(toU(p.w))}" r="5" fill="#c13cb4" stroke="#fff" stroke-width="2"/>`
                    : `<circle cx="${X(i)}" cy="${Y(toU(p.w))}" r="4" fill="#fff" stroke="#6c3ce0" stroke-width="2"/>`;
            });
            s += `<circle id="lc-dot" r="6" fill="#6c3ce0" stroke="#fff" stroke-width="2" visibility="hidden"/>`;
            [[0, 'start'], [pts.length - 1, 'end']].forEach(([i, a]) => { s += `<text class="ax" x="${X(i)}" y="${H - 5}" text-anchor="${a}">${pad(pts[i].d.getDate())}/${pad(pts[i].d.getMonth() + 1)}</text>`; });
            s += `<rect class="lc-hit" x="${pl - 8}" y="0" width="${pw + 16}" height="${H}" fill="transparent" onpointermove="lcMove(event)" onpointerdown="lcMove(event)" onpointerleave="lcLeave()"/>`;
            return s + '</svg>';
        }
        function lcMove(e) {
            if (!LC) return;
            const svg = $('lc'), r = svg.getBoundingClientRect(), k = LC.VW / r.width;
            const i = Math.max(0, Math.min(LC.pts.length - 1, Math.round(((e.clientX - r.left) * k - LC.pl) / LC.pw * (LC.pts.length - 1))));
            const p = LC.pts[i], x = LC.X(i), y = LC.Y(toU(p.w));
            const lx = $('lc-x'), dot = $('lc-dot');
            lx.setAttribute('x1', x); lx.setAttribute('x2', x); lx.setAttribute('visibility', 'visible');
            dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('visibility', 'visible');
            showTipAt(r.left + x / k, r.top + y / k, fdate(p.d) + '|' + W(p.w) + ' × ' + p.r + (p.pr ? ' · 🏆 recorde' : ''));
        }
        function lcLeave() { if (!$('lc')) return; $('lc-x').setAttribute('visibility', 'hidden'); $('lc-dot').setAttribute('visibility', 'hidden'); hideTip(); }

        function renderProgress() {
            $('hist-count').textContent = S.history.length + ' sessões';
            const seg = `<div class="seg">
                <button class="${S.progTab === 'sum' ? 'on' : ''}" onclick="S.progTab='sum';renderProgress()">Resumo</button>
                <button class="${S.progTab === 'hist' ? 'on' : ''}" onclick="S.progTab='hist';renderProgress()">Histórico</button></div>`;
            $('prog-body').innerHTML = seg + (S.progTab === 'sum' ? progSummary() : progHistory());
        }

        function progSummary() {
            const since = periodStart(), ss = S.history.filter(s => s.date >= since);
            const v = sum(ss, s => sum(s.exercises, e => vol(e.sets)));
            const prList = [];
            S.history.forEach(s => s.exercises.forEach(e => e.sets.forEach(x => { if (x.pr) prList.push({ d: s.date, e, x }); })));
            const prsIn = prList.filter(p => p.d >= since).length;
            const keys = [...new Set(S.history.flatMap(s => s.exercises.filter(e => e.mid).map(e => e.mid)))].sort((a, b) => countOf(b) - countOf(a));
            if (!keys.includes(S.progKey)) S.progKey = keys[0];
            const lc = lineChart(S.progKey);
            const kp = LC ? LC.pts : [];
            const first = kp.length ? kp[0].w : 0, lastW = kp.length ? kp[kp.length - 1].w : 0;
            const dW = lastW - first;
            return `
                <div class="filter-row" style="padding-top:0">
                    ${[4, 12].map(n => `<button class="fc${S.period === n ? ' on' : ''}" onclick="S.period=${n};renderProgress()">${n} semanas</button>`).join('')}
                </div>
                <div class="kpis">
                    <div class="kpi"><div class="l">${I('calendar')}Treinos</div><div class="v">${ss.length}</div><div class="s">${fmt(ss.length / S.period)} por semana</div></div>
                    <div class="kpi"><div class="l">${I('dumbbell')}Volume</div><div class="v">${VOL(v)}</div><div class="s">${ss.length ? VOL(v / ss.length) + ' / treino' : '—'}</div></div>
                    <div class="kpi"><div class="l">${I('trophy')}Recordes</div><div class="v">${prsIn}</div><div class="s">no período</div></div>
                    <div class="kpi"><div class="l">${I('clock')}Duração média</div><div class="v">${ss.length ? Math.round(sum(ss, s => s.dur) / ss.length) : 0} min</div><div class="s">FC média ${ss.length ? Math.round(sum(ss, s => s.hrAvg) / ss.length) : '—'} bpm</div></div>
                </div>
                <div class="card">
                    <div class="ch-head"><div class="ch-title">Volume por semana</div><div class="ch-sub">${S.unit} levantados</div></div>
                    ${barChart(weeksData(S.period))}
                </div>
                <div class="card">
                    <div class="ch-head"><div class="ch-title">Frequência</div><div class="ch-sub">${ss.length} dias treinados</div></div>
                    ${heatmap(S.period)}
                    <div class="hm-legend">Menos ${SEQ.map(c => `<i style="background:${c}"></i>`).join('')} Mais</div>
                </div>
                ${bodyCard()}
                <div class="slabel">carga por máquina</div>
                <div class="hscroll" style="margin-bottom:10px">${keys.map(k => `<button class="mchip${k === S.progKey ? ' on' : ''}" onclick="S.progKey='${k}';renderProgress()">${tile(M[k])}${M[k].name}</button>`).join('')}</div>
                <div class="card">
                    <div class="ch-head"><div class="ch-title">${M[S.progKey].name}</div><div class="ch-sub">maior carga por sessão</div></div>
                    ${lc}
                    ${kp.length > 1 ? `<div class="lc-stats">
                        <div><div class="v">${W(first)}</div><div class="l">Início</div></div>
                        <div><div class="v">${W(lastW)}</div><div class="l">Atual</div></div>
                        <div><div class="v" style="color:${dW > 0 ? 'var(--gr)' : 'var(--ink)'}">${dW > 0 ? '+' : ''}${fmt(toU(dW))} ${S.unit}</div><div class="l">${first ? (dW >= 0 ? '+' : '') + Math.round(dW / first * 100) + '%' : ''}</div></div>
                    </div>` : ''}
                </div>
                <div class="slabel">recordes recentes</div>
                <div class="list">${prList.slice(0, 5).map(p => `
                    <div class="lrow" style="cursor:default">${tile(p.e)}
                        <div class="lbody"><div class="lname">${exName(p.e)}</div><div class="lmeta">${fdate(p.d)} · ${ago(p.d)}</div></div>
                        <span class="chip gold">${I('trophy')}${Wn(p.x.w)} × ${p.x.r}</span>
                    </div>`).join('') || '<div class="empty-sm">Nenhum recorde ainda</div>'}
                </div>`;
        }

        function progHistory() {
            const f = S.histFilter;
            const list = S.history.filter(s => f === 'all' || s.exercises.some(e => e.cat === f));
            let html = `<div class="filter-row">${[['all', 'Todos'], ['chest', 'Peito'], ['back', 'Costas'], ['legs', 'Pernas'], ['shoulder', 'Ombro'], ['arms', 'Braços']]
                .map(([c, l]) => `<button class="fc${f === c ? ' on' : ''}" onclick="filtHist('${c}')">${l}</button>`).join('')}</div>`;
            let month = '';
            list.forEach(s => {
                const m = MONF[s.date.getMonth()] + ' ' + s.date.getFullYear();
                if (m !== month) { month = m; html += `<div class="month">${m}</div>`; }
                const ex = f === 'all' ? s.exercises : s.exercises.filter(e => e.cat === f);
                const prs = sum(s.exercises, e => e.sets.filter(x => x.pr).length);
                html += `<div class="card sess" onclick="openSession('${s.id}')">
                    <div class="sess-top">
                        <div class="date-badge"><b>${s.date.getDate()}</b><span>${DOW[s.date.getDay()]}</span></div>
                        <div class="lbody"><div class="lname">${s.planName} · ${s.focus}</div><div class="lmeta">${hhmm(s.date)} · ${s.dur} min · ${VOL(sum(s.exercises, e => vol(e.sets)))}</div></div>
                        ${prs ? `<span class="chip gold">🏆 ${prs}</span>` : ''}
                    </div>
                    ${ex.map(e => `<div class="sess-ex"><span class="n">${exName(e)}</span><div class="si-sets">${e.sets.map(x => `<span class="si-set${x.pr ? ' pr' : ''}">${Wn(x.w)}×${x.r}${x.pr ? ' 🏆' : ''}</span>`).join('')}</div></div>`).join('')}
                </div>`;
            });
            return html || '<div class="empty-sm">Nenhuma sessão</div>';
        }

        // Composição corporal: primeira vs. última avaliação física
        function bodyCard() {
            const ev = S.evals; if (!ev.length) return '';
            const z = ev[0], a = ev[ev.length - 1];
            const dl = (v, u) => ev.length > 1 ? `<span style="color:${v < 0 ? 'var(--gr)' : v > 0 ? 'var(--re)' : 'var(--mu)'}">${v > 0 ? '+' : ''}${fmt(v)} ${u}</span>` : '';
            return `<div class="slabel">composição corporal <small>${ago(z.date)}</small></div>
                <div class="card">
                    <div class="lc-stats" style="margin-top:0">
                        <div><div class="v">${fmt(z.weight)} kg</div><div class="l">Peso ${dl(z.weight - a.weight, 'kg')}</div></div>
                        <div><div class="v">${fmt(z.fat)}%</div><div class="l">Gordura ${dl(z.fat - a.fat, 'pp')}</div></div>
                        <div><div class="v">${z.waist ? fmt(z.waist) + ' cm' : '—'}</div><div class="l">Cintura ${z.waist && a.waist ? dl(z.waist - a.waist, 'cm') : ''}</div></div>
                    </div>
                    <div class="info-line">${I('calendar')}${ev.length} avaliações desde ${fdate(a.date)}</div>
                    <button class="btn bo" style="width:100%;margin-top:12px" onclick="openCalc('aval')">${I('body')}Nova avaliação</button>
                </div>`;
        }

        function filtHist(c) { S.histFilter = c; renderProgress(); }
        function openSession(id) { S.summary = S.history.find(s => s.id === id); S.summaryLive = false; nav('summary'); }

        // ── CALCULADORAS (portadas do FitCalc) ──────────────────
        // Fórmulas e faixas de projects/fila/gymtag/fit_calculator/DOCUMENTACAO.md;
        // campos vêm preenchidos com os dados do aluno e os resultados alimentam o app.
        const CALCS = {
            aval: { t: 'Avaliação física', d: 'IMC, % gordura, cintura, RCQ, VO2 máx', ico: 'body', c: CATS.chest },
            fc: { t: 'FC e zonas', d: 'FC máxima (Tanaka) e zonas por Karvonen', ico: 'heart', c: CATS.shoulder },
            gasto: { t: 'Gasto calórico', d: 'kcal por atividade (MET × peso × tempo)', ico: 'flame', c: CATS.arms },
            consumo: { t: 'Consumo calórico', d: 'TMB, gasto diário, meta e macros', ico: 'apple', c: CATS.legs },
            pace: { t: 'Velocidade e pace', d: 'Ritmo, tempo e distância de corrida', ico: 'clock', c: CATS.back },
            conv: { t: 'Conversor', d: 'Peso, distância, velocidade e temperatura', ico: 'refresh', c: CATS.core },
        };
        const METS = [['Musculação', 5], ['Corrida 8 km/h', 6], ['Corrida 10 km/h', 9.8], ['Corrida 14 km/h', 14], ['Caminhada 5 km/h', 3.5], ['Ciclismo', 8],
        ['Natação', 7], ['Futebol', 7.5], ['Yoga', 4], ['Pular corda', 8], ['Dança', 6], ['Pilates', 3]];
        const ACTS = [[1.2, 'Sedentário', 'sem exercício'], [1.375, 'Levemente ativo', '1 a 3 dias/sem'], [1.55, 'Moderadamente ativo', '3 a 5 dias/sem'],
        [1.725, 'Muito ativo', '6 a 7 dias/sem'], [1.9, 'Extremamente ativo', 'treino 2×/dia ou trabalho físico']];
        const GOALS = [[-500, 'Perder peso'], [-250, 'Perder devagar'], [0, 'Manter'], [250, 'Ganhar devagar'], [500, 'Ganhar massa']];

        const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? '' : n; };
        const kcalOf = o => Math.round(5 * S.user.weight * o.dur / 60);   // musculação = MET 5
        const avgDur = () => S.history.length ? Math.round(sum(S.history.slice(0, 12), s => s.dur) / Math.min(12, S.history.length)) : 50;
        const perWeek = () => { const s = periodStartN(4); return S.history.filter(x => x.date >= s).length / 4; };
        function periodStartN(n) { const s = weekStart(new Date()); s.setDate(s.getDate() - 7 * (n - 1)); return s; }
        function suggestAct() { const f = perWeek(); return f < 1 ? 1.2 : f < 3 ? 1.375 : f < 5.5 ? 1.55 : 1.725; }

        const classIMC = v => v < 18.5 ? ['Abaixo do peso', 'gold'] : v < 25 ? ['Peso normal', 'ok'] : v < 30 ? ['Sobrepeso', 'gold'] : v < 35 ? ['Obesidade grau I', 'bad'] : v < 40 ? ['Obesidade grau II', 'bad'] : ['Obesidade grau III', 'bad'];
        function classFat(v, sex) {
            const lim = sex === 'm' ? [6, 14, 18, 25] : [14, 21, 25, 32], i = lim.findIndex(l => v < l);
            return [['Essencial', 'gold'], ['Atleta', 'ok'], ['Boa forma', 'ok'], ['Aceitável', ''], ['Acima do ideal', 'bad']][i < 0 ? 4 : i];
        }
        const risk3 = (v, a, b, labels) => v < a ? [labels[0], 'ok'] : v < b ? [labels[1], 'gold'] : [labels[2], 'bad'];

        // Avaliação física: IMC + Deurenberg (% gordura) + Brocca + RCQ/RCA + Uth-Sørensen (VO2)
        function evalCalc(e) {
            const hm = e.h / 100, imc = e.w / (hm * hm);
            const fat = 1.2 * imc + 0.23 * e.age - 10.8 * (e.sex === 'm' ? 1 : 0) - 5.4;
            const fcmax = Math.round(208 - 0.7 * e.age);
            return {
                imc, fat, fcmax,
                vo2: e.rest > 0 ? 15 * fcmax / e.rest : null,
                brocca: e.sex === 'm' ? (e.h - 100) - (e.h - 150) / 4 : (e.h - 100) - (e.h - 150) / 2,
                faixa: [18.5 * hm * hm, 24.9 * hm * hm],
                rcq: e.waist > 0 && e.hip > 0 ? e.waist / e.hip : null,
                rca: e.waist > 0 ? e.waist / e.h : null,
            };
        }

        let F = {};
        function openCalc(k) {
            const u = S.user, le = S.evals[0];
            S.calc = k;
            F = {
                sex: u.sex, age: u.age, w: u.weight, h: u.height, waist: le ? le.waist : '', hip: le ? le.hip : '', rest: u.restHr,
                mi: 0, dur: avgDur(), act: u.act || suggestAct(), goal: u.goal, pmode: 'vel', dist: 5, du: 'km', th: 0, tm: 25, ts: 0, v: 10, cg: 'peso'
            };
            nav('calcx');
        }

        function renderCalc() {
            const le = S.evals[0];
            const prev = {
                aval: le ? `IMC ${fmt(le.imc)} · ${fmt(le.fat)}% gordura · ${ago(le.date)}` : 'Nenhuma avaliação ainda',
                fc: `FC máx ${hrMax()} · repouso ${S.user.restHr || '—'} bpm`,
                gasto: `~${kcalOf({ dur: avgDur() })} kcal no seu treino médio (${avgDur()} min)`,
                consumo: S.user.goalKcal ? `Meta: ${fmt(S.user.goalKcal, 0)} kcal/dia` : 'Defina sua meta diária',
            };
            $('calc-body').innerHTML = `
                <div class="slabel hint" style="margin-top:0">Ferramentas do FitCalc com os seus dados já preenchidos</div>
                <div class="list">${Object.entries(CALCS).map(([k, c]) => `
                    <div class="lrow" onclick="openCalc('${k}')">
                        <div class="tile" style="background:${c.c.bg};color:${c.c.fg}">${I(c.ico)}</div>
                        <div class="lbody"><div class="lname">${c.t}</div><div class="lmeta">${prev[k] || c.d}</div></div>
                        <div class="lend">${I('chev')}</div>
                    </div>`).join('')}
                </div>`;
        }

        // campos do formulário: atualizam F e recalculam só o bloco de resultado
        function inp(k, l, u, full) {
            return `<label class="cf${full ? ' full' : ''}"><span>${l}</span><div class="cf-in"><input class="inp" type="number" inputmode="decimal" value="${F[k]}" oninput="F.${k}=num(this.value);calcRes()">${u ? `<em>${u}</em>` : ''}</div></label>`;
        }
        function pick(k, opts, cls) {
            return `<div class="opt-grid ${cls || ''}">${opts.map(([v, l, s]) => `<button class="${F[k] === v ? 'on' : ''}" onclick="F.${k}=${typeof v === 'string' ? `'${v}'` : v};renderCalcx()">${l}${s ? `<small>${s}</small>` : ''}</button>`).join('')}</div>`;
        }
        const sexPick = () => `<div class="cf full"><span>Sexo biológico</span>${pick('sex', [['m', 'Masculino'], ['f', 'Feminino']], 'two')}</div>`;
        const rrow = (l, v, c, note) => `<div class="lrow" style="cursor:default"><div class="lbody"><div class="lname">${l}</div>${note ? `<div class="lmeta">${note}</div>` : ''}</div><div class="lend" style="color:var(--ink);font-weight:600">${v}</div>${c ? `<span class="chip ${c[1]}">${c[0]}</span>` : ''}</div>`;
        const big = items => `<div class="big3">${items.map(([l, v, c]) => `<div><div class="l">${l}</div><div class="v">${v}</div>${c ? `<span class="chip ${c[1]}">${c[0]}</span>` : ''}</div>`).join('')}</div>`;
        const needs = msg => `<div class="empty-sm">${msg}</div>`;
        const hms = h => { const s = Math.round(h * 3600); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
        const paceStr = kmh => { const m = 60 / kmh, mm = Math.floor(m), ss = Math.round((m - mm) * 60); return mm + "'" + pad(ss === 60 ? 0 : ss) + '"'; };
        const classVel = v => v < 6 ? 'Caminhada' : v < 9 ? 'Corrida leve' : v < 11 ? 'Corrida moderada' : v < 14 ? 'Corrida intensa' : 'Corrida de elite';
        const toKm = (d, u) => u === 'm' ? d / 1000 : u === 'mi' ? d * 1.60934 : d;

        function renderCalcx() {
            const k = S.calc, c = CALCS[k];
            $('calcx-title').textContent = c.t;
            let form = '';
            if (k === 'aval') form = `<div class="cgrid">${sexPick()}${inp('age', 'Idade', 'anos')}${inp('w', 'Peso', 'kg')}${inp('h', 'Altura', 'cm')}${inp('waist', 'Cintura', 'cm')}${inp('hip', 'Quadril', 'cm')}${inp('rest', 'FC repouso', 'bpm')}</div>`;
            if (k === 'fc') form = `<div class="cgrid">${inp('age', 'Idade', 'anos')}${inp('rest', 'FC de repouso', 'bpm')}</div>
                ${hrDev() ? `<div class="br"><button class="btn bo" onclick="F.rest=Math.round(hrVal);renderCalcx();toast('❤️ Leitura do ${hrDev().name} — meça parado, sentado')">${I('heart')}Medir com o ${hrDev().name}</button></div>` : ''}`;
            if (k === 'gasto') form = `<div class="slabel" style="margin-top:0">atividade</div>${pick('mi', METS.map(([l, m], i) => [i, l, 'MET ' + fmt(m)]))}<div class="cgrid">${inp('w', 'Peso', 'kg')}${inp('dur', 'Duração', 'min')}</div>`;
            if (k === 'consumo') form = `<div class="cgrid">${sexPick()}${inp('age', 'Idade', 'anos')}${inp('w', 'Peso', 'kg')}${inp('h', 'Altura', 'cm', true)}</div>
                <div class="slabel">nível de atividade <small>sugerido: ${ACTS.find(a => a[0] === suggestAct())[1].toLowerCase()}</small></div>${pick('act', ACTS, 'one')}
                <div class="slabel">objetivo</div>${pick('goal', GOALS.map(([v, l]) => [v, l, (v > 0 ? '+' : '') + v + ' kcal']))}`;
            if (k === 'pace') {
                const m = F.pmode, distF = `${inp('dist', 'Distância', '', false)}<div class="cf"><span>Unidade</span>${pick('du', [['km', 'km'], ['m', 'm'], ['mi', 'mi']], 'three')}</div>`;
                const timeF = `<div class="cgrid three">${inp('th', 'Horas', 'h')}${inp('tm', 'Minutos', 'min')}${inp('ts', 'Segundos', 's')}</div>`;
                form = `<div class="seg">${[['vel', 'Velocidade'], ['pace', 'Pace'], ['tempo', 'Tempo'], ['dist', 'Distância']].map(([v, l]) => `<button class="${m === v ? 'on' : ''}" onclick="F.pmode='${v}';renderCalcx()">${l}</button>`).join('')}</div>`
                    + (m === 'vel' ? `<div class="cgrid">${distF}</div>${timeF}`
                        : m === 'pace' ? `<div class="cgrid">${inp('v', 'Velocidade', 'km/h', true)}</div>`
                            : m === 'tempo' ? `<div class="cgrid">${distF}${inp('v', 'Velocidade', 'km/h', true)}</div>`
                                : `<div class="cgrid">${inp('v', 'Velocidade', 'km/h', true)}</div>${timeF}`);
            }
            if (k === 'conv') form = `<div class="seg">${Object.keys(CONV).map(g => `<button class="${F.cg === g ? 'on' : ''}" onclick="F.cg='${g}';renderCalcx()">${CONV[g].l}</button>`).join('')}</div>
                <div class="cgrid">${Object.entries(CONV[F.cg].u).map(([u, d]) => `<label class="cf"><span>${d[1]}</span><div class="cf-in"><input class="inp" id="cv-${u}" type="number" inputmode="decimal" oninput="convIn('${u}',this.value)"><em>${d[0]}</em></div></label>`).join('')}</div>`;
            $('calcx-body').innerHTML = form + '<div id="calc-res"></div>';
            calcRes();
        }

        function calcRes() {
            const k = S.calc, el = $('calc-res'); if (!el) return;
            let h = '';
            if (k === 'aval') {
                if (!(F.age > 0 && F.w > 0 && F.h > 0)) { el.innerHTML = needs('Informe idade, peso e altura.'); return; }
                const r = evalCalc(F);
                h = `<div class="slabel">resultado</div><div class="card">${big([['IMC', fmt(r.imc), classIMC(r.imc)], ['% gordura', fmt(r.fat) + '%', classFat(r.fat, F.sex)], ['VO2 máx', r.vo2 ? fmt(r.vo2) : '—', r.vo2 ? null : ['informe FC rep.', '']]])}</div>
                    <div class="list">
                        ${rrow('Peso ideal', fmt(r.brocca) + ' kg', null, 'Fórmula de Brocca modificada')}
                        ${rrow('Faixa saudável', fmt(r.faixa[0], 0) + '–' + fmt(r.faixa[1], 0) + ' kg', null, 'IMC entre 18,5 e 24,9')}
                        ${F.waist > 0 ? rrow('Cintura', fmt(F.waist) + ' cm', F.sex === 'm' ? risk3(F.waist, 94, 102, ['risco baixo', 'moderado', 'elevado']) : risk3(F.waist, 80, 88, ['risco baixo', 'moderado', 'elevado'])) : ''}
                        ${r.rcq ? rrow('Cintura / quadril', fmt(r.rcq, 2), F.sex === 'm' ? risk3(r.rcq, .9, .95, ['baixo', 'moderado', 'alto']) : risk3(r.rcq, .8, .85, ['baixo', 'moderado', 'alto'])) : ''}
                        ${r.rca ? rrow('Cintura / altura', fmt(r.rca, 2), risk3(r.rca, .5, .6, ['adequado', 'elevado', 'muito elevado'])) : ''}
                    </div>
                    <div class="br"><button class="btn bp" onclick="saveEval()">${I('check')}Salvar avaliação</button></div>
                    <div class="slabel">histórico <small>${S.evals.length} avaliações</small></div>
                    <div class="list">${S.evals.map((e, i) => {
                    const p = S.evals[i + 1], d = p ? e.weight - p.weight : 0;
                    return `<div class="lrow" style="cursor:default"><div class="date-badge"><b>${e.date.getDate()}</b><span>${MON[e.date.getMonth()]}</span></div>
                            <div class="lbody"><div class="lname">${fmt(e.weight)} kg${p ? `<span class="chip ${d < 0 ? 'ok' : d > 0 ? 'gold' : ''}">${d > 0 ? '+' : ''}${fmt(d)} kg</span>` : ''}</div>
                            <div class="lmeta">${fmt(e.fat)}% gordura · IMC ${fmt(e.imc)}${e.waist ? ' · cintura ' + fmt(e.waist) + ' cm' : ''}</div></div></div>`;
                }).join('')}</div>`;
            }
            if (k === 'fc') {
                if (!(F.age > 0)) { el.innerHTML = needs('Informe a idade.'); return; }
                const max = Math.round(208 - 0.7 * F.age), rest = F.rest >= 30 && F.rest <= 120 ? F.rest : 0;
                const goals = ['Recuperação, aquecimento', 'Base aeróbica, queima de gordura', 'Condicionamento cardiovascular', 'Limiar anaeróbico', 'Potência máxima'];
                h = `<div class="slabel">resultado</div><div class="card">${big([['FC máxima', max + ' bpm'], ['FC reserva', rest ? (max - rest) + ' bpm' : '—'], ['Método', rest ? 'Karvonen' : '% FC máx']])}</div>
                    <div class="list">${ZONES.map((z, i) => {
                    const lo = Math.round(rest + z[0] * (max - rest)), hi = Math.round(rest + z[1] * (max - rest));
                    return `<div class="lrow" style="cursor:default"><div class="tile" style="width:36px;height:36px;border-radius:12px;background:${z[2]}22;color:${z[2]};font-weight:700;font-size:13px">Z${i + 1}</div>
                            <div class="lbody"><div class="lname">${lo}–${hi} bpm</div><div class="lmeta">${goals[i]}</div></div></div>`;
                }).join('')}</div>
                    <div class="br"><button class="btn bp" onclick="applyFc()">${I('check')}Usar no meu perfil</button></div>`;
            }
            if (k === 'gasto') {
                if (!(F.w > 0 && F.dur > 0)) { el.innerHTML = needs('Informe peso e duração.'); return; }
                const act = METS[F.mi], kcal = act[1] * F.w * F.dur / 60;
                h = `<div class="slabel">resultado</div><div class="card">${big([['Gasto', fmt(kcal, 0) + ' kcal'], ['Energia', fmt(kcal * 4.184, 0) + ' kJ'], ['MET', fmt(act[1])]])}
                    <div class="info-line">${I('flame')}${act[0]}: equivale a ~${fmt(kcal / (3.5 * F.w / 60), 0)} min de caminhada leve ou ~${fmt(kcal / 265)} fatias de pão</div></div>
                    <div class="card"><div class="lname">${I('dumbbell').replace('class="ic"', 'class="ic" style="width:16px;height:16px;color:var(--acc)"')} Nos seus treinos</div>
                    <div class="lmeta" style="margin-top:4px">Musculação (MET 5) com ${fmt(S.user.weight)} kg: o GymTag estima ~${kcalOf({ dur: avgDur() })} kcal num treino de ${avgDur()} min. Essa estimativa aparece no resumo e no comprovante de cada treino.</div></div>`;
            }
            if (k === 'consumo') {
                if (!(F.age > 0 && F.w > 0 && F.h > 0)) { el.innerHTML = needs('Preencha idade, peso e altura.'); return; }
                const tmb = 10 * F.w + 6.25 * F.h - 5 * F.age + (F.sex === 'm' ? 5 : -161), tdee = tmb * F.act, meta = tdee + F.goal;
                const mac = [['Proteína', .30, 4, CATS.chest.fg], ['Carboidrato', .45, 4, CATS.arms.fg], ['Gordura', .25, 9, CATS.shoulder.fg]];
                h = `<div class="slabel">resultado</div><div class="card">${big([['TMB', fmt(tmb, 0)], ['Gasto diário', fmt(tdee, 0)], ['Meta', fmt(meta, 0)]])}
                    <div class="info-line">${I('bolt')}kcal/dia · Mifflin-St Jeor · ${F.goal < 0 ? 'perda de peso' : F.goal > 0 ? 'ganho de massa' : 'manutenção'}</div></div>
                    <div class="big3" style="margin:0 20px 12px">${mac.map(([l, p, d, c]) => `<div style="background:var(--s2);box-shadow:var(--sh-sm)"><div class="l">${l}</div><div class="v" style="color:${c}">${fmt(meta * p / d, 0)} g</div><div class="l" style="margin:2px 0 0">${Math.round(p * 100)}% · ${fmt(meta * p, 0)} kcal</div></div>`).join('')}</div>
                    <div class="br"><button class="btn bp" onclick="saveGoal(${Math.round(meta)})">${I('check')}Salvar meta no perfil</button></div>`;
            }
            if (k === 'pace') {
                const t = (+F.th || 0) + (+F.tm || 0) / 60 + (+F.ts || 0) / 3600, km = toKm(+F.dist || 0, F.du), v = +F.v || 0;
                const m = F.pmode;
                if (m === 'vel') {
                    if (!(km > 0 && t > 0)) { el.innerHTML = needs('Informe distância e tempo.'); return; }
                    const kmh = km / t;
                    h = big([['Velocidade', fmt(kmh) + ' km/h'], ['Pace', paceStr(kmh) + '/km'], ['m/s', fmt(kmh / 3.6, 2)]]);
                    h = `<div class="slabel">resultado</div><div class="card">${h}<div class="info-line">${I('clock')}${classVel(kmh)}</div></div>`;
                } else if (m === 'pace') {
                    if (!(v > 0)) { el.innerHTML = needs('Informe a velocidade.'); return; }
                    h = `<div class="slabel">resultado</div><div class="card">${big([['Pace/km', paceStr(v)], ['Pace/milha', paceStr(v / 1.60934)], ['m/s', fmt(v / 3.6, 2)]])}<div class="info-line">${I('clock')}${classVel(v)}</div></div>`;
                } else if (m === 'tempo') {
                    if (!(km > 0 && v > 0)) { el.innerHTML = needs('Informe distância e velocidade.'); return; }
                    h = `<div class="slabel">resultado</div><div class="card">${big([['Tempo', hms(km / v)], ['Minutos', fmt(km / v * 60)], ['Pace', paceStr(v) + '/km']])}</div>`;
                } else {
                    if (!(v > 0 && t > 0)) { el.innerHTML = needs('Informe velocidade e tempo.'); return; }
                    const d = v * t;
                    h = `<div class="slabel">resultado</div><div class="card">${big([['km', fmt(d, 2)], ['metros', fmt(d * 1000, 0)], ['milhas', fmt(d / 1.60934, 2)]])}</div>`;
                }
            }
            el.innerHTML = h;
        }

        // Conversor: cada grupo converte via uma unidade base
        const CONV = {
            peso: { l: 'Peso', u: { kg: ['kg', 'Quilos', 1], lbs: ['lb', 'Libras', 2.20462], g: ['g', 'Gramas', 1000], oz: ['oz', 'Onças', 35.274] } },
            dist: { l: 'Distância', u: { km: ['km', 'Quilômetros', 1], mi: ['mi', 'Milhas', 1 / 1.60934], m: ['m', 'Metros', 1000], ft: ['ft', 'Pés', 3280.84] } },
            vel: { l: 'Velocidade', u: { kmh: ['km/h', 'km/h', 1], mph: ['mph', 'Milhas/h', 1 / 1.60934], ms: ['m/s', 'Metros/s', 1 / 3.6], kn: ['nós', 'Nós', 1 / 1.852] } },
            temp: { l: 'Temp.', u: { c: ['°C', 'Celsius'], f: ['°F', 'Fahrenheit'], k: ['K', 'Kelvin'] } },
        };
        function convIn(u, raw) {
            const g = CONV[F.cg], v = num(raw);
            const toBase = (x, uu) => F.cg !== 'temp' ? x / g.u[uu][2] : uu === 'f' ? (x - 32) * 5 / 9 : uu === 'k' ? x - 273.15 : x;
            const fromBase = (b, uu) => F.cg !== 'temp' ? b * g.u[uu][2] : uu === 'f' ? b * 9 / 5 + 32 : uu === 'k' ? b + 273.15 : b;
            const base = v === '' ? null : toBase(v, u);
            Object.keys(g.u).forEach(o => { if (o !== u) $('cv-' + o).value = base == null ? '' : String(+fromBase(base, o).toFixed(4)); });
        }

        function saveEval() {
            const r = evalCalc(F);
            S.evals.unshift({ date: new Date(), weight: F.w, waist: +F.waist || null, hip: +F.hip || null, rest: +F.rest || null, imc: r.imc, fat: r.fat });
            Object.assign(S.user, { weight: F.w, height: F.h, sex: F.sex, age: F.age });
            if (F.rest > 0) S.user.restHr = F.rest;
            toast('💾 Avaliação salva — veja em Evolução');
            calcRes();
        }
        function applyFc() {
            S.user.age = F.age; S.user.hrMax = null;
            if (F.rest >= 30 && F.rest <= 120) S.user.restHr = F.rest;
            toast('❤️ Zonas atualizadas: FC máx ' + hrMax() + ' bpm');
        }
        function saveGoal(kcal) {
            Object.assign(S.user, { goal: F.goal, act: F.act, goalKcal: kcal, weight: F.w, height: F.h, sex: F.sex, age: F.age });
            toast('🎯 Meta de ' + fmt(kcal, 0) + ' kcal/dia salva');
        }

        // ── PERFIL ───────────────────────────────────────────────
        function renderProfile() {
            const u = S.user, hd = hrDev(), pd = printer(), mx = hrMax(), le = S.evals[0];
            const prs = sum(S.history, s => sum(s.exercises, e => e.sets.filter(x => x.pr).length));
            $('prof-body').innerHTML = `
                <div class="card">
                    <div class="prof"><div class="avatar">RS</div><div><b>${u.full}</b><span>${GYM.name} · ${GYM.unit}<br>Aluno desde ${u.since}</span></div></div>
                    <div class="mini-stats">
                        <div><div class="v">${S.history.length}</div><div class="l">Treinos</div></div>
                        <div><div class="v">${prs}</div><div class="l">Recordes</div></div>
                        <div><div class="v">${VOL(sum(S.history, s => sum(s.exercises, e => vol(e.sets))))}</div><div class="l">Volume total</div></div>
                    </div>
                </div>
                <div class="slabel">treino</div>
                <div class="list">
                    <div class="srow tap" onclick="nav('plans')"><div class="tile">${I('clipboard')}</div><div class="lbody"><b>Fonte dos treinos</b><span>Fichas da academia + ${PROGRAMS.filter(g => g.origin === 'me').length} divisão(ões) sua(s)</span></div><div class="lend">${I('chev')}</div></div>
                    <div class="srow"><div class="tile">${I('dumbbell')}</div><div class="lbody"><b>Unidade de carga</b><span>Usada em todo o app</span></div>
                        <div class="mini-seg">${['kg', 'lb'].map(x => `<button class="${S.unit === x ? 'on' : ''}" onclick="setUnit('${x}')">${x}</button>`).join('')}</div></div>
                    <div class="srow"><div class="tile">${I('bolt')}</div><div class="lbody"><b>Incremento sugerido</b><span>Quando você bate as reps</span></div>
                        <div class="mini-seg">${[1, 2.5, 5].map(x => `<button class="${S.incr === x ? 'on' : ''}" onclick="S.incr=${x};renderProfile()">${fmt(toU(x))}</button>`).join('')}</div></div>
                </div>
                <div class="slabel">frequência cardíaca</div>
                <div class="list">
                    <div class="srow"><div class="tile">${I('user')}</div><div class="lbody"><b>Idade</b><span>Usada para estimar a FC máxima</span></div>
                        <div class="stepper"><button onclick="setAge(-1)">${I('minus')}</button><b>${u.age}</b><button onclick="setAge(1)">${I('plus')}</button></div></div>
                    <div class="srow"><div class="tile">${I('heart')}</div><div class="lbody"><b>FC de repouso</b><span>Medida parado, sentado</span></div>
                        <div class="stepper"><button onclick="setRest(-1)">${I('minus')}</button><b>${u.restHr}</b><button onclick="setRest(1)">${I('plus')}</button></div></div>
                    <div class="srow"><div class="tile">${I('flame')}</div><div class="lbody"><b>FC máxima</b><span>${u.hrMax ? 'Definida manualmente · <a href="#" onclick="S.user.hrMax=null;renderProfile();return false" style="color:var(--acc)">usar estimativa</a>' : 'Estimada (Tanaka: 208 − 0,7 × idade)'}</span></div>
                        <div class="stepper"><button onclick="setHrMax(-1)">${I('minus')}</button><b>${mx}</b><button onclick="setHrMax(1)">${I('plus')}</button></div></div>
                    <div style="padding:2px 0 14px">
                        <div class="zbar">${ZONES.map((z, i) => `<div style="color:${z[2]}"><i style="background:${z[2]}"></i><b>Z${i + 1}</b>${zoneRange(i).join('–')}</div>`).join('')}</div>
                        <div class="lmeta" style="text-align:center;margin-top:8px">Zonas por Karvonen (FC de reserva)</div>
                    </div>
                </div>
                <div class="slabel">corpo e calculadoras</div>
                <div class="list">
                    <div class="srow tap" onclick="openCalc('aval')"><div class="tile">${I('body')}</div><div class="lbody"><b>Avaliação física</b><span>${le ? `${fmt(le.weight)} kg · ${fmt(le.fat)}% gordura · ${ago(le.date)}` : 'Nenhuma avaliação'}</span></div><div class="lend">${I('chev')}</div></div>
                    <div class="srow tap" onclick="openCalc('consumo')"><div class="tile">${I('apple')}</div><div class="lbody"><b>Meta diária</b><span>${u.goalKcal ? fmt(u.goalKcal, 0) + ' kcal/dia' : 'Calcular TMB, gasto diário e macros'}</span></div><div class="lend">${I('chev')}</div></div>
                    <div class="srow tap" onclick="nav('calc')"><div class="tile">${I('calc')}</div><div class="lbody"><b>Calculadoras</b><span>FC e zonas, gasto calórico, pace, conversor...</span></div><div class="lend">${I('chev')}</div></div>
                </div>
                <div class="slabel">dispositivos</div>
                <div class="list">
                    <div class="srow tap" onclick="nav('devices')"><div class="tile">${I('heart')}</div><div class="lbody"><b>Monitor cardíaco</b><span>${hd ? hd.name + ' · conectado' : 'Nenhum conectado'}</span></div>${hd ? '<span class="chip ok">ON</span>' : '<span class="chip">OFF</span>'}<div class="lend">${I('chev')}</div></div>
                    <div class="srow tap" onclick="nav('devices')"><div class="tile">${I('printer')}</div><div class="lbody"><b>Impressora térmica</b><span>${pd ? pd.name + ' · ' + pd.model + ' · 58mm' : 'Nenhuma conectada'}</span></div>${pd ? '<span class="chip ok">ON</span>' : '<span class="chip">OFF</span>'}<div class="lend">${I('chev')}</div></div>
                    <div class="srow tap" onclick="printNow()"><div class="tile">${I('file')}</div><div class="lbody"><b>Testar impressão</b><span>Imprime uma página de teste</span></div></div>
                </div>
                <div class="slabel">conta</div>
                <div class="list">
                    <div class="srow tap" onclick="syncGym()"><div class="tile">${I('refresh')}</div><div class="lbody"><b>Sincronizar com a academia</b><span>Última sincronização ${GYM.synced}</span></div></div>
                    <div class="srow tap" onclick="toast('Protótipo: sessão mantida')"><div class="tile" style="background:#fde8ef;color:var(--re)">${I('logout')}</div><div class="lbody"><b style="color:var(--re)">Sair</b></div></div>
                </div>`;
        }

        function setUnit(u) { S.unit = u; renderProfile(); toast('Cargas em ' + u); }
        function setAge(d) { S.user.age = Math.max(14, Math.min(90, S.user.age + d)); renderProfile(); }
        function setHrMax(d) { S.user.hrMax = Math.max(120, Math.min(230, hrMax() + d)); renderProfile(); }
        function setRest(d) { S.user.restHr = Math.max(30, Math.min(120, S.user.restHr + d)); renderProfile(); }

        // ── DISPOSITIVOS ─────────────────────────────────────────
        function renderDevices() {
            const hd = hrDev(), mx = hrMax(), z = zoneOf(hrVal);
            $('dev-body').innerHTML = `
                <div class="card">
                    <div class="hr-top">
                        <div class="hr-device">${hd ? hd.name : 'Monitor cardíaco'}<span style="${hd ? '' : 'color:var(--mu)'}">${hd ? '♥ Conectado · RSSI ' + hd.rssi + ' dBm' : 'Desconectado'}</span></div>
                        <div style="text-align:right"><div class="hr-bpm" id="ble-bpm">${hd ? Math.round(hrVal) : '—'}</div><div class="hr-unit">bpm</div></div>
                    </div>
                    <div class="hr-chart" id="hr-chart"></div>
                    <div class="zbar" style="margin-top:14px">${ZONES.map((r, i) => `<div class="${hd && i === z ? 'cur' : ''}" style="color:${r[2]}"><i style="background:${r[2]}"></i><b>Z${i + 1}</b>${zoneRange(i).join('–')}</div>`).join('')}</div>
                    <div class="info-line" style="justify-content:center">${I('heart')}FC máx ${mx} · repouso ${S.user.restHr} bpm · ajuste em Perfil</div>
                </div>
                <div class="slabel">dispositivos encontrados</div>
                <div style="padding:0 20px">${bleDevices.map((d, i) => {
                const rc = d.rssi > -60 ? 's' : d.rssi > -75 ? 'm' : 'w';
                return `<div class="card dev-card ${d.cn ? 'cn' : ''}" style="margin:0 0 10px" onclick="toggleDev(${i})">
                        <div class="tile">${I(d.ico)}</div>
                        <div class="lbody"><div class="lname">${d.name}</div><div class="dev-addr">${d.type} · ${d.addr}</div>${d.cn ? '<span class="chip ok" style="margin-top:5px">CONECTADO</span>' : ''}</div>
                        <div><div class="dev-rssi ${rc}">${d.rssi}dBm</div><div class="sigb ${d.sig}"><span></span><span></span><span></span><span></span></div></div>
                    </div>`;
            }).join('')}</div>`;
            renderHRChart();
        }

        function toggleDev(i) {
            const d = bleDevices[i];
            if (d.cn) { d.cn = false; toast('🔌 ' + d.name + ' desconectado'); }
            else {
                bleDevices.forEach((x, j) => { if (j !== i && x.type === d.type) x.cn = false; });
                d.cn = true; toast('✅ ' + d.name + ' conectado via BLE');
            }
            renderDevices(); simHR();
        }

        // ── BOOT ─────────────────────────────────────────────────
        const RENDER = { home: renderHome, plans: renderPlans, plan: renderPlan, edit: renderEdit, scan: renderScan, summary: renderSummary, progress: renderProgress, profile: renderProfile, devices: renderDevices, calc: renderCalc, calcx: renderCalcx };
        renderHome();
        renderScan();
    </script>
</body>

</html>
