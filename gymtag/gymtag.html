<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymTag</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

        :root {
            --bg: #ece8f6;
            --s1: #f7f5fc;
            --s2: #ffffff;
            --s3: #f2eefb;
            --bd: #ebe6f5;
            --acc: #6c3ce0;
            --acc2: #c13cb4;
            --grad: linear-gradient(135deg, #6c3ce0 0%, #9a3ccc 55%, #c13cb4 100%);
            --tint: #efe9fd;
            --ink: #1b1530;
            --tx: #1b1530;
            --mu: #8e89a3;
            --re: #e5487d;
            --am: #f29a2e;
            --gr: #1fb57a;
            --bl: #3d7bf2;
            --sh: 0 10px 30px -12px rgba(76, 46, 160, .22);
            --sh-sm: 0 4px 14px -6px rgba(76, 46, 160, .18);
            --mono: 'DM Mono', monospace;
            --sans: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--sans);
            color: var(--tx);
            overflow: hidden;
            background-image: radial-gradient(ellipse at 15% 20%, rgba(193, 60, 180, .14) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 85%, rgba(108, 60, 224, .16) 0%, transparent 55%);
        }

        button, input { font-family: inherit; color: inherit }

        .phone {
            width: 375px;
            height: 812px;
            background: var(--s1);
            border-radius: 48px;
            border: 8px solid #fff;
            box-shadow: 0 40px 80px -30px rgba(60, 30, 140, .35), 0 0 0 1px rgba(108, 60, 224, .06);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .phone::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 104px;
            height: 28px;
            background: #14101f;
            border-radius: 20px;
            z-index: 100;
        }

        @media(max-width:600px) {
            body { padding: 0; align-items: flex-start; background: var(--s1) }
            .phone { width: 100vw; height: 100dvh; border-radius: 0; border: none; box-shadow: none }
            .phone::before { display: none }
            .sb { padding-top: 12px; height: 52px }
            .nav { margin-bottom: 10px }
        }

        /* ─── FRAME ─── */
        .sb {
            height: 48px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 26px 6px;
            flex-shrink: 0;
            font-size: 11px;
            color: var(--ink);
        }

        .sb .t { font-size: 13px; font-weight: 600 }
        .sb svg { width: 16px; height: 16px }

        .screens { flex: 1; position: relative; overflow: hidden }

        .scr {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            opacity: 0;
            pointer-events: none;
            scrollbar-width: none;
            transition: opacity .22s ease, transform .22s ease;
            transform: translateX(20px);
            padding-bottom: 24px;
        }

        .scr::-webkit-scrollbar { display: none }
        .scr.on { opacity: 1; transform: translateX(0); pointer-events: all }

        .nav {
            height: 70px;
            margin: 0 14px 14px;
            background: var(--s2);
            border-radius: 26px;
            box-shadow: var(--sh);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 4px;
            flex-shrink: 0;
            position: relative;
            z-index: 5;
        }

        .nb {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 0;
            color: var(--mu);
            font-size: 10px;
            font-weight: 500;
            transition: color .2s;
        }

        .nb .nb-i {
            width: 44px;
            height: 30px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }

        .nb.on { color: var(--acc); font-weight: 600 }
        .nb.on .nb-i { background: var(--tint) }

        .nb.fab { margin-top: -34px; gap: 6px }

        .nb.fab .nb-i {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--grad);
            color: #fff;
            border: 5px solid var(--s1);
            box-shadow: 0 12px 24px -10px rgba(108, 60, 224, .8);
        }

        .nb.fab.on .nb-i { background: var(--grad) }
        .nb.fab .ic { width: 24px; height: 24px }

        .toast {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--ink);
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            z-index: 999;
            box-shadow: 0 12px 30px -10px rgba(27, 21, 48, .5);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
        }

        .toast.on { opacity: 1; transform: translateX(-50%) translateY(0) }

        /* ─── SHARED ─── */
        .ic {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .phdr { padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
        .phdr h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; flex: 1 }
        .phdr .back { display: none }

        .hdr-sub { padding: 14px 20px 12px; display: flex; align-items: center; gap: 12px }
        .hdr-sub h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

        .back, .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--s2);
            border: none;
            box-shadow: var(--sh-sm);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .back .ic, .icon-btn .ic { width: 20px; height: 20px }
        .icon-btn.acc { background: var(--grad); color: #fff; box-shadow: 0 8px 18px -8px rgba(108, 60, 224, .7) }
        .icon-btn.sm { width: 32px; height: 32px; box-shadow: none; background: var(--s3) }
        .icon-btn.sm .ic { width: 16px; height: 16px }

        .badge {
            font-size: 10px;
            font-weight: 600;
            color: var(--acc);
            background: var(--tint);
            padding: 5px 11px;
            border-radius: 999px;
            letter-spacing: .03em;
            white-space: nowrap;
        }

        .badge.gr { color: var(--gr); background: #e3f6ee }
        .badge.am { color: #c9761a; background: #fdf0e0 }
        .badge.bl { color: var(--bl); background: #e6eefd }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--mu);
            background: var(--s3);
            padding: 3px 9px;
            border-radius: 999px;
            white-space: nowrap;
            vertical-align: middle;
        }

        .chip .ic { width: 12px; height: 12px; stroke-width: 2 }
        .chip.acc { color: var(--acc); background: var(--tint) }
        .chip.ok { color: var(--gr); background: #e3f6ee }
        .chip.gold { color: #c9761a; background: #fdf0e0 }
        .chip.solid { color: #fff; background: var(--grad) }
        .chip.bad { color: var(--re); background: #fde8ef }

        .slabel {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
            padding: 0 20px;
            margin: 20px 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .slabel::first-letter { text-transform: uppercase }
        .slabel small { font-size: 12px; font-weight: 500; color: var(--mu) }
        .slabel.hint { font-size: 13px; font-weight: 400; color: var(--mu); margin-bottom: 14px }

        .card {
            background: var(--s2);
            border-radius: 22px;
            box-shadow: var(--sh-sm);
            padding: 16px;
            margin: 0 20px 12px;
        }

        .btn {
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity .15s, transform .1s;
            padding: 14px 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn .ic { width: 18px; height: 18px }
        .btn:active { opacity: .85; transform: scale(.98) }
        .bp { background: var(--grad); color: #fff; box-shadow: 0 10px 22px -10px rgba(108, 60, 224, .7) }
        .bo { background: var(--s2); color: var(--ink); box-shadow: var(--sh-sm) }
        .bw { background: #fff; color: var(--acc) }
        .bgl { background: rgba(255, 255, 255, .18); color: #fff }
        .bt { background: none; color: var(--re); font-weight: 500; font-size: 13px }

        .br { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 10px }
        .br .btn { flex: 1 }
        .br .btn.sq { flex: 0 0 52px; padding: 14px 0 }

        .tile {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tile .ic { width: 21px; height: 21px }

        .seg {
            margin: 0 20px 14px;
            background: var(--s2);
            border-radius: 999px;
            box-shadow: var(--sh-sm);
            padding: 4px;
            display: flex;
        }

        .seg button {
            flex: 1;
            border: none;
            background: none;
            border-radius: 999px;
            padding: 9px 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--mu);
            cursor: pointer;
            transition: all .2s;
        }

        .seg button.on { background: var(--grad); color: #fff; font-weight: 600; box-shadow: 0 6px 14px -6px rgba(108, 60, 224, .7) }

        .filter-row {
            display: flex;
            gap: 8px;
            padding: 4px 20px 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-row::-webkit-scrollbar { display: none }

        .fc {
            flex-shrink: 0;
            background: var(--s2);
            border: none;
            border-radius: 999px;
            box-shadow: var(--sh-sm);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            color: var(--mu);
            cursor: pointer;
            white-space: nowrap;
            transition: all .2s;
        }

        .fc.on { background: var(--ink); color: #fff; font-weight: 600 }

        .lrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--bd); cursor: pointer }
        .lrow:last-child { border-bottom: none }
        .lrow:active { opacity: .7 }
        .lbody { flex: 1; min-width: 0 }
        .lname { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
        .lmeta { font-size: 11px; color: var(--mu); margin-top: 1px }
        .lend { color: var(--mu); display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500 }
        .lend .ic { width: 18px; height: 18px }
        .list { margin: 0 20px 12px; background: var(--s2); border-radius: 22px; box-shadow: var(--sh-sm); padding: 2px 16px }

        .si-sets { display: flex; gap: 6px; flex-wrap: wrap }
        .si-set { background: var(--s3); border-radius: 10px; padding: 4px 9px; font-size: 11px; font-weight: 500; color: var(--ink); white-space: nowrap }
        .si-set.pr { background: var(--grad); color: #fff }

        .empty { text-align: center; padding: 30px 30px 10px; color: var(--mu); font-size: 13px }
        .empty .tile { width: 64px; height: 64px; border-radius: 22px; margin: 0 auto 14px; background: var(--tint); color: var(--acc) }
        .empty .tile .ic { width: 30px; height: 30px }
        .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px }

        /* ─── HERO (gradient) ─── */
        .hero {
            margin: 0 20px 14px;
            background: var(--grad);
            color: #fff;
            border-radius: 28px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 34px -16px rgba(108, 60, 224, .75);
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            right: -70px;
            top: -80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
        }

        .hero > * { position: relative }
        .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 16px }
        .hero-lbl { font-size: 12px; color: rgba(255, 255, 255, .8) }
        .hero-title { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2 }
        .hero-sub { font-size: 12px; color: rgba(255, 255, 255, .8); margin-top: 2px }
        .hero-stats { display: flex; gap: 8px; margin-bottom: 14px }
        .hero-stats > div { flex: 1; text-align: center; background: rgba(255, 255, 255, .14); border-radius: 16px; padding: 9px 2px }
        .hero-stats .v { font-size: 17px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap }
        .hero-stats .l { font-size: 10px; color: rgba(255, 255, 255, .75); margin-top: 2px }
        .hero-act { display: flex; gap: 8px }
        .hero-act .btn { flex: 1; padding: 12px 14px }
        .hero-note { font-size: 12px; font-weight: 500; background: rgba(255, 255, 255, .16); border-radius: 12px; padding: 8px 12px; margin-top: -2px }

        .ring { width: 64px; height: 64px; position: relative; flex-shrink: 0 }
        .ring svg { width: 64px; height: 64px; transform: rotate(-90deg) }
        .ring circle { fill: none; stroke-width: 6 }
        .ring .rt { stroke: rgba(255, 255, 255, .22) }
        .ring .rp { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .4s }
        .ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600 }

        /* ─── HOME ─── */
        .greeting .g-sub { font-size: 13px; color: var(--mu); margin-bottom: 2px }
        .greeting .g-sub::first-letter { text-transform: uppercase }
        .greeting h2 { font-size: 23px; font-weight: 700; letter-spacing: -.02em }

        .greeting h2 span {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--grad);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: var(--sh-sm);
        }

        .week { display: flex; gap: 6px; padding: 0 20px; margin-bottom: 16px }

        .wd {
            flex: 1;
            background: var(--s2);
            border-radius: 16px;
            padding: 8px 0 7px;
            text-align: center;
            box-shadow: var(--sh-sm);
        }

        .wd span { display: block; font-size: 10px; color: var(--mu) }
        .wd b { display: block; font-size: 14px; font-weight: 600; margin: 1px 0 3px }
        .wd i { display: block; width: 6px; height: 6px; border-radius: 50%; margin: 0 auto; background: transparent }
        .wd.done i { background: var(--acc) }
        .wd.fut { background: transparent; box-shadow: none; opacity: .55 }
        .wd.today { background: var(--ink); color: #fff }
        .wd.today span { color: rgba(255, 255, 255, .6) }
        .wd.today.done i { background: #fff }

        .ble-pill {
            margin: 0 20px 6px;
            background: var(--s2);
            border-radius: 20px;
            box-shadow: var(--sh-sm);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .ble-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0 }
        .ble-dot.on { background: var(--gr); box-shadow: 0 0 0 4px rgba(31, 181, 122, .16) }
        .ble-dot.off { background: #cfcadc }
        .ble-pill .t { font-size: 13px; font-weight: 600 }
        .ble-pill .s { font-size: 11px; color: var(--mu) }
        .ble-hr { margin-left: auto; font-size: 17px; font-weight: 600; color: var(--re); font-variant-numeric: tabular-nums; white-space: nowrap }
        .ble-hr small { font-size: 10px; font-weight: 500; color: var(--mu) }

        .ri.ok .lname { color: var(--mu) }
        .st-ok { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); color: #fff; display: flex; align-items: center; justify-content: center }
        .st-ok .ic { width: 15px; height: 15px; stroke-width: 2.6 }
        .st-nfc { color: #c4bcdc }

        /* ─── PLANS ─── */
        .gym-banner { display: flex; align-items: center; gap: 12px }
        .gym-banner .tile { background: var(--tint); color: var(--acc) }

        .plan-card { cursor: pointer; transition: transform .15s }
        .plan-card:active { transform: scale(.99) }
        .pc-top { display: flex; align-items: center; gap: 12px }

        .pc-letter {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: var(--grad);
            color: #fff;
            font-size: 19px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pc-letter.me { background: var(--ink) }
        .pc-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--bd); font-size: 11px; color: var(--mu) }


        .add-card {
            margin: 0 20px 12px;
            border: 1.5px dashed #d6cbf3;
            border-radius: 22px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--acc);
            cursor: pointer;
            background: none;
            width: calc(100% - 40px);
        }

        .add-card:hover { background: var(--tint) }
        .add-card .ic { width: 18px; height: 18px }

        .prog-list { margin-top: 10px; border-top: 1px solid var(--bd) }
        .prog .pc-letter { width: 38px; height: 38px; border-radius: 13px; font-size: 16px }
        .prog-act { display: flex; gap: 8px }
        .prog-act:not(:empty) { margin-top: 6px }
        .prog-act .btn { flex: 1; padding: 11px 8px; font-size: 12px; background: var(--s3); color: var(--acc) }
        .prog-act .btn .ic { width: 16px; height: 16px }

        .split-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 20px 12px }
        .split-pick button { border: 1.5px dashed #d6cbf3; background: none; border-radius: 18px; padding: 12px 0; cursor: pointer; color: var(--acc) }
        .split-pick button:hover { background: var(--tint) }
        .split-pick b { display: block; font-size: 17px; letter-spacing: .08em }
        .split-pick span { font-size: 10px; color: var(--mu) }

        .effort { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 20px 10px }

        .effort button {
            border: none;
            background: var(--s2);
            box-shadow: var(--sh-sm);
            border-radius: 16px;
            padding: 9px 2px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            transition: background .15s;
        }

        .effort span { font-size: 18px; line-height: 1.2 }
        .effort b { font-size: 11px; font-weight: 600 }
        .effort small { font-size: 9px; color: var(--mu) }
        .effort button.on { background: var(--ink); color: #fff }
        .effort button.on small { color: rgba(255, 255, 255, .6) }

        .mc-prog { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--bd); cursor: pointer }
        .mc-prog b { display: block; font-size: 12px; font-weight: 600 }
        .mc-prog span { font-size: 10px; color: var(--mu) }
        .mc-prog svg { flex: 1; height: 32px; min-width: 0 }
        .mc-prog .d { font-size: 12px; font-weight: 700; white-space: nowrap }

        .info-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mu); margin-top: 10px }
        .info-line .ic { width: 16px; height: 16px; color: var(--acc) }
        .mini-stats { display: flex; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--bd) }
        .mini-stats > div { flex: 1; text-align: center }
        .mini-stats > div + div { border-left: 1px solid var(--bd) }
        .mini-stats .v { font-size: 17px; font-weight: 700 }
        .mini-stats .l { font-size: 10px; color: var(--mu) }

        .tagchip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; color: var(--acc); background: var(--tint); padding: 3px 8px; border-radius: 999px; white-space: nowrap }
        .tagchip .ic { width: 12px; height: 12px; stroke-width: 2 }

        /* ─── EDITOR ─── */
        .field { margin: 0 20px 12px }
        .field label { display: block; font-size: 12px; font-weight: 500; color: var(--mu); margin: 0 0 6px 4px }

        .inp {
            width: 100%;
            background: var(--s2);
            border: 1.5px solid transparent;
            border-radius: 16px;
            box-shadow: var(--sh-sm);
            font-size: 14px;
            padding: 13px 16px;
            outline: none;
            transition: border-color .2s;
        }

        .inp:focus { border-color: var(--acc) }

        .daypick { display: flex; gap: 6px }

        /* ─── SHEET ─── */
        .sheet-bg { position: absolute; inset: 0; background: rgba(27, 21, 48, .35); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .25s }

        .nfc-opt {

            width: 108px;
            height: 108px;

            color: var(--acc);

            justify-content: center;

        @keyframes rip {
            0% { opacity: .7; transform: scale(.85) }
            100% { opacity: 0; transform: scale(1) }

        .sz-ring .ic { width: 40px; height: 40px; stroke-width: 1.6 }

        .add-set {

        .kpi .l { font-size: 11px; color: var(--mu); display: flex; align-items: center; gap: 6px }
        .kpi .l .ic { width: 15px; height: 15px; color: var(--acc) }
        .kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; line-height: 1.1 }
        .kpi .s { font-size: 11px; color: var(--mu); margin-top: 2px }

        .ch-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px }
        .ch-title { font-size: 14px; font-weight: 600 }
        .ch-sub { font-size: 11px; color: var(--mu) }
        .chart { display: block; width: 100%; height: auto; overflow: visible }
        .chart .grid { stroke: #efebf7; stroke-width: 1 }
        .chart .ax { font-family: var(--sans); font-size: 9px; fill: var(--mu) }
        .chart .hit { fill: transparent; cursor: pointer }
        .chart .hit:hover { fill: rgba(108, 60, 224, .06) }
        .chart .cell { cursor: pointer }
        .hm-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 10px; color: var(--mu); margin-top: 8px }
        .hm-legend i { width: 12px; height: 12px; border-radius: 3px; display: block }
        .lc-stats { display: flex; gap: 8px; margin-top: 12px }
        .lc-stats > div { flex: 1; background: var(--s3); border-radius: 14px; padding: 9px 6px; text-align: center }
        .lc-stats .v { font-size: 14px; font-weight: 700; white-space: nowrap }
        .lc-stats .l { font-size: 10px; color: var(--mu) }
        .empty-sm { font-size: 12px; color: var(--mu); text-align: center; padding: 26px 0 }

        /* ─── CALCULADORAS ─── */
        .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 20px 12px }
        .cgrid.three { grid-template-columns: repeat(3, 1fr) }
        .cf { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--mu); min-width: 0 }
        .cf.full { grid-column: 1 / -1 }
        .cf-in { position: relative }
        .cf-in em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 12px; color: var(--mu); pointer-events: none }
        .cf .inp { padding: 11px 44px 11px 14px; color: var(--ink); font-weight: 600; -moz-appearance: textfield }
        .cf .inp::-webkit-inner-spin-button { -webkit-appearance: none }
        .cf .opt-grid { margin: 0 }

        .opt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 20px 12px }
        .opt-grid.two { grid-template-columns: 1fr 1fr }
        .opt-grid.three { grid-template-columns: repeat(3, 1fr) }
        .opt-grid.one { grid-template-columns: 1fr }

        .opt-grid button {
            border: none;
            background: var(--s2);
            box-shadow: var(--sh-sm);
            border-radius: 14px;
            padding: 10px 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
            text-align: center;

        .opt-grid.one button { text-align: left; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center }
        .opt-grid button small { display: block; font-size: 10px; font-weight: 500; color: var(--mu) }
        .opt-grid button.on { background: var(--ink); color: #fff }

        .big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }

        .big3 .l { font-size: 10px; color: var(--mu) }
        .big3 .v { font-size: 18px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap }

        .tip.on { opacity: 1 }

        .srow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--bd) }

        .hr-unit { font-size: 12px; color: var(--mu) }

        .dev-card.cn { border-color: rgba(31, 181, 122, .35) }
        .dev-card .tile { background: #e6eefd; color: var(--bl) }
        .dev-card.cn .tile { background: #e3f6ee; color: var(--gr) }

        .sigb { display: flex; gap: 3px; justify-content: flex-end; align-items: flex-end; height: 14px }

        /* ─── RECEIPT ─── */

        .rb { font-weight: 500 }
        .rs { font-size: 10px; color: #8e89a3 }
        .rdv { border-top: 1px dashed #cfc8e0; margin: 8px 0 }
        .rsp { height: 6px }
        .rrow { display: flex; justify-content: space-between; gap: 10px }
    </style>

            viewPlan: null, planTab: 'gym', draft: null, sheet: null, delArm: false,
            progTab: 'sum', period: 12, progKey: 'sup_reto_01', histFilter: 'all',
            history: [],
        };

        // ── HELPERS ──────────────────────────────────────────────
        const $ = id => document.getElementById(id);
        const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const DOWF = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
        const MON = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
        const MONF = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
        const pad = n => String(n).padStart(2, '0');
        const fmt = (n, d = 1) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: d });
        const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
        const dayKey = d => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        const sameDay = (a, b) => dayKey(a) === dayKey(b);
        const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
        const fdate = d => DOW[d.getDay()] + ' · ' + pad(d.getDate()) + ' ' + MON[d.getMonth()];
        const weekStart = d => { const x = sod(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
        const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
        function ago(d) {
            const n = Math.round((sod(new Date()) - sod(d)) / 864e5);
            return n === 0 ? 'hoje' : n === 1 ? 'ontem' : 'há ' + n + ' dias';
        }

        // Unidade: tudo é guardado em kg e convertido só na exibição
        const LB = 2.20462;
        const toU = kg => S.unit === 'lb' ? Math.round(kg * LB * 2) / 2 : kg;
        const fromU = v => { v = parseFloat(String(v).replace(',', '.')) || 0; return S.unit === 'lb' ? Math.round(v / LB * 100) / 100 : v; };
        const W = kg => kg ? fmt(toU(kg)) + ' ' + S.unit : 'Peso corporal';
        const Wn = kg => kg ? fmt(toU(kg)) : 'PC';
        const VOL = kg => { const v = toU(kg); return (v >= 10000 ? fmt(v / 1000) + ' mil' : fmt(Math.round(v), 0)) + ' ' + S.unit; };
        const vol = sets => sum(sets, s => s.w * s.r);

        // Exercício de plano ou de sessão: máquina (mid) ou livre (name)
        const exKey = e => e.mid || ('free:' + e.name);
        const exName = e => e.mid ? M[e.mid].name : e.name;
        const exCat = e => e.mid ? M[e.mid].cat : (e.cat || 'core');
        const exIco = e => (e.mid && M[e.mid].ico) || CATS[exCat(e)].ico;
        function tile(e, extra) {
            const c = CATS[exCat(e)];
            return `<div class="tile" style="background:${c.bg};color:${c.fg}${extra || ''}">${I(exIco(e))}</div>`;
        }

        // FC máx de Tanaka (208 − 0,7 × idade); zonas por Karvonen quando há FC de repouso
        const hrMax = () => S.user.hrMax || Math.round(208 - 0.7 * S.user.age);
        const ZONES = [[.5, .6, '#9aa3b8'], [.6, .7, '#3d7bf2'], [.7, .8, '#1fb57a'], [.8, .9, '#f29a2e'], [.9, 1, '#e5487d']];
        const zoneRange = i => { const r = S.user.restHr || 0, m = hrMax(); return ZONES[i].slice(0, 2).map(p => Math.round(r + p * (m - r))); };
        const zoneOf = bpm => { let z = 0; ZONES.forEach((_, i) => { if (bpm >= zoneRange(i)[0]) z = i; }); return z; };
        const hrDev = () => bleDevices.find(d => d.type === 'Monitor Cardíaco' && d.cn);
        const printer = () => bleDevices.find(d => d.type === 'Impressora térmica' && d.cn);

        // ── HISTÓRICO SIMULADO (12 semanas) ─────────────────────
        function rng(s) { return () => (s = s * 16807 % 2147483647) / 2147483647; }
        function genHistory() {
            const R = rng(11), out = [], today = sod(new Date()), top = {}, gym = PROGRAMS[0];
            const EFS = ['easy', 'ok', 'ok', 'ok', 'hard', 'hard', 'fail'];
            let rot = 0;
            for (let d = 84; d >= 1; d--) {
                const day = new Date(today); day.setDate(day.getDate() - d);
                let plan = null;
                if (day.getDay() === 0) { if (R() < .35) plan = PLANS[3]; }
                else if (R() >= .22) { const id = gym.ids[rot++ % gym.ids.length]; plan = PLANS.find(p => p.id === id); }
                if (!plan) continue;
                const date = new Date(day); date.setHours(6 + Math.floor(R() * 4), Math.floor(R() * 60));
                const exercises = plan.items.map(it => {
                    const k = exKey(it), step = it.w >= 40 ? 2.5 : 1;
                    let tw;
                    if (plan.origin === 'gym') {
                        if (top[k] == null) top[k] = Math.round(it.w * .85 / step) * step;
                        else if (R() < .32) top[k] = Math.min(it.w, top[k] + step);
                        tw = top[k];
                    } else tw = it.w ? Math.min(top[k] ?? it.w, it.w) : 0;
                    const sets = [];
                    for (let i = 0; i < it.sets; i++) {
                        const drop = i === it.sets - 1 && tw > step && R() < .4;
                        sets.push({ w: drop ? tw - step : tw, r: Math.max(4, it.reps - (i ? Math.floor(R() * 3) : 0)) });
                    }
                    return { mid: it.mid, name: exName(it), cat: exCat(it), sets, effort: EFS[Math.floor(R() * EFS.length)], note: NOTES[it.mid] || '' };
                });
                const hrAvg = 112 + Math.floor(R() * 22);
                out.push({ id: 'h' + d, date, planId: plan.id, planName: plan.name, focus: plan.focus, dur: 42 + Math.floor(R() * 28), hrAvg, hrMax: hrAvg + 28 + Math.floor(R() * 16), exercises });
            }
            // recorde = carga acima de todas as sessões anteriores daquele exercício
            const max = {};
            out.forEach(s => s.exercises.forEach(e => {
                const k = exKey(e);
                e.sets.forEach(x => { x.pr = max[k] != null && x.w > 0 && x.w > max[k]; if (max[k] == null || x.w > max[k]) max[k] = x.w; });
            }));
            return out.reverse();
        }
        S.history = genHistory();

        // Avaliações físicas anteriores (a cada ~4 semanas); IMC e % gordura calculados na carga
        S.evals = [[3, 78.4, 86, 98.5, 62], [31, 79.2, 87.5, 99, 64], [59, 80.1, 88.5, 99.5, 66], [87, 81.3, 90, 100, 68]].map(([d, w, waist, hip, rest]) => {
            const date = new Date(); date.setDate(date.getDate() - d); date.setHours(8, 30);
            const hm = S.user.height / 100, imc = w / (hm * hm);
            return { date, weight: w, waist, hip, rest, imc, fat: 1.2 * imc + 0.23 * S.user.age - 10.8 - 5.4 };
        });

        function lastOf(key) {
            for (const s of S.history) { const e = s.exercises.find(x => exKey(x) === key); if (e) return { date: s.date, sets: e.sets, effort: e.effort, note: e.note }; }
            return null;
        }
        const countOf = key => S.history.filter(s => s.exercises.some(e => exKey(e) === key)).length;
        function prBase(key) {
            let p = 0;
            S.history.forEach(s => s.exercises.forEach(e => { if (exKey(e) === key) e.sets.forEach(x => { p = Math.max(p, x.w); }); }));
            const se = S.session && S.session.ex[key];
            if (se && !(S.current && S.current.key === key)) se.sets.forEach(x => { p = Math.max(p, x.w); });
            return p;
        }
        // Sugestão de carga: reps batidas na última vez + esforço percebido
        //   fácil → +2 incrementos · moderado → +1 se bateu as reps · difícil → mantém · falhei → −1
        function suggest(key, item) {
            const l = lastOf(key);
            if (!l) return { w: item ? item.w : 20, up: 0, why: 'carga do plano' };
            const t = Math.max(...l.sets.map(s => s.w));
            if (!t) return { w: 0, up: 0, why: '' };
            const hit = l.sets[0].r >= (item ? item.reps : 10);
            const rule = {
                easy: [hit ? 2 : 1, 'última vez foi fácil'],
                ok: [hit ? 1 : 0, hit ? 'bateu as reps com folga' : 'faltaram reps'],
                hard: [0, 'última vez foi no limite'],
                fail: [-1, 'não completou da última vez'],
            }[l.effort] || [hit ? 1 : 0, hit ? 'bateu as reps' : 'manter até bater as reps'];
            const up = rule[0] * S.incr;
            return { w: Math.max(0, t + up), up, why: rule[1] };
        }

        const planOf = id => PLANS.find(p => p.id === id);
        const progOf = id => PROGRAMS.find(g => g.ids.includes(id));
        function nextInProg(g) {
            if (!g || !g.ids.length) return null;
            const last = S.history.find(s => g.ids.includes(s.planId));
            return last ? g.ids[(g.ids.indexOf(last.planId) + 1) % g.ids.length] : g.ids[0];
        }
        const todayPlan = () => planOf(S.todayPlanId) || planOf(nextInProg(PROGRAMS.find(g => g.id === S.activeProg))) || PLANS[0];
        const nextItem = () => todayPlan().items.find(it => !(S.session && S.session.ex[exKey(it)]));

        // ── NAV ─────────────────────────────────────────────────
        const TAB_OF = { home: 'home', plans: 'plans', plan: 'plans', edit: 'plans', scan: 'scan', summary: 'home', receipt: 'home', progress: 'progress', profile: 'profile', devices: 'profile', calc: 'profile', calcx: 'profile' };
        const navOrder = ['home', 'plans', 'scan', 'progress', 'profile'];
        let stack = ['home'];
        function setTab(id) { document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.s === TAB_OF[id])); }
        // Voltar no topo só quando há tela anterior; aba aberta pela barra inferior é raiz
        function syncBack(id) {
            const b = document.querySelector('#s-' + id + ' > .phdr .back, #s-' + id + ' > .hdr-sub .back');
            if (b) b.style.display = stack.length > 1 ? 'flex' : 'none';
        }
        function tab(id) {
            if (document.querySelector('.scr.on').id === 's-' + id) { stack = [id]; syncBack(id); return; }
            stack = [];
            nav(id);
        }
        function nav(id) {
            const old = document.querySelector('.scr.on'), nw = $('s-' + id);
            if (!nw) return;
            if (RENDER[id]) RENDER[id]();
            if (old === nw) return;
            stack.push(id);
            syncBack(id);
            const oi = navOrder.indexOf(old.id.slice(2)), ni = navOrder.indexOf(id);
            animate(old, nw, ni >= 0 ? ni >= (oi >= 0 ? oi : 0) : true);
            setTab(id);
        }
        function goBack() {
            stack.pop();
            const t = stack[stack.length - 1] || 'home';
            stack.pop();
            const old = document.querySelector('.scr.on'), nw = $('s-' + t);
            if (!nw || old === nw) return;
            stack.push(t);
            syncBack(t);
            if (RENDER[t]) RENDER[t]();
            animate(old, nw, false);
            setTab(t);
        }
        function animate(old, nw, fwd) {
            hideTip();
            old.style.cssText = 'transition:opacity .2s ease,transform .2s ease;opacity:0;transform:translateX(' + (fwd ? '-22px' : '22px') + ')';
            setTimeout(() => {
                old.classList.remove('on'); old.style.cssText = '';
                nw.style.cssText = 'transition:none;opacity:0;transform:translateX(' + (fwd ? '22px' : '-22px') + ')';
                nw.classList.add('on'); nw.scrollTop = 0;
                requestAnimationFrame(() => {
                    nw.style.cssText = 'transition:opacity .25s ease,transform .25s ease;opacity:1;transform:translateX(0)';
                    setTimeout(() => { nw.style.cssText = ''; }, 280);
                });
            }, 180);
        }

        // ── CLOCK / TOAST ───────────────────────────────────────
        function updClock() { $('clk').textContent = hhmm(new Date()); }
        updClock(); setInterval(updClock, 30000);

        let tTmr;
        function toast(msg) {
            const el = $('tst');
            el.textContent = msg; el.classList.add('on');
            clearTimeout(tTmr);
            tTmr = setTimeout(() => el.classList.remove('on'), 2400);
        }

        // ── TOOLTIP (gráficos) ──────────────────────────────────
        function showTipAt(cx, cy, txt) {
            const tip = $('tip'), ph = document.querySelector('.phone').getBoundingClientRect();
            const [a, b] = txt.split('|');
            tip.innerHTML = '<b>' + a + '</b>' + (b ? '<span>' + b + '</span>' : '');
            tip.classList.add('on');
            const x = Math.max(8, Math.min(ph.width - tip.offsetWidth - 24, cx - ph.left - tip.offsetWidth / 2));
            tip.style.left = x + 'px';
            tip.style.top = (cy - ph.top - tip.offsetHeight - 14) + 'px';
        }
        function hideTip() { $('tip').classList.remove('on'); }
        function tipEvt(e) {
            const t = e.target.closest && e.target.closest('[data-tip]');
            if (t) showTipAt(e.clientX, e.clientY, t.dataset.tip);
            else if (!e.target.closest || !e.target.closest('.lc-hit')) hideTip();
        }
        document.addEventListener('pointermove', tipEvt);
        document.addEventListener('pointerdown', tipEvt);

        // ── FREQUÊNCIA CARDÍACA (simulada) ──────────────────────
        let hrVal = 74;
        const hrHistory = [68, 70, 72, 74, 76, 80, 82, 85, 88, 86, 84, 82, 78, 76, 74, 72, 74, 76, 78, 80];
        function simHR() {
            hrVal = Math.max(55, Math.min(185, hrVal + (Math.random() > .5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 1)));
            hrHistory.push(hrVal); if (hrHistory.length > 20) hrHistory.shift();
            const on = !!hrDev(), v = Math.round(hrVal);
            if (on && S.session) S.session.hr.push(v);
            $('sb-hrw').style.display = on ? 'flex' : 'none';
            $('sb-hr').textContent = v;
            [['home-hr', v + ' <small>bpm</small>'], ['h-hr', on ? v : '—'], ['ble-bpm', on ? v : '—']].forEach(([id, h]) => { const el = $(id); if (el) el.innerHTML = h; });
            renderHRChart();
        }
        function renderHRChart() {
            const el = $('hr-chart'); if (!el) return;
            const max = Math.max(...hrHistory), min = Math.min(...hrHistory);
            el.innerHTML = hrHistory.map(v => {
                const h = Math.round(((v - min) / (max - min || 1)) * 40) + 4;
                const c = v < 120 ? 'rgba(229,72,125,.3)' : v < 150 ? 'rgba(229,72,125,.6)' : 'rgba(229,72,125,1)';
                return '<div class="hr-bar" style="height:' + h + 'px;background:' + c + '"></div>';
            }).join('');
        }
        setInterval(simHR, 1200);

        // Cronômetro do treino em andamento
        setInterval(() => {
            const el = $('h-time');
            if (el && S.session) { const s = Math.floor((Date.now() - S.session.start) / 1000); el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
        }, 1000);

        // ── INÍCIO ───────────────────────────────────────────────
        function renderHome() {
            const p = todayPlan(), ss = S.session, now = new Date(), next = nextItem();
            const doneN = p.items.filter(it => ss && ss.ex[exKey(it)]).length;
            const pct = p.items.length ? doneN / p.items.length : 0, C = 2 * Math.PI * 24;
            const totalSets = sum(p.items, it => it.sets);
            const sv = ss ? Object.values(ss.ex) : [];

            const ws = weekStart(now);
            let week = '';
            for (let i = 0; i < 7; i++) {
                const d = new Date(ws); d.setDate(d.getDate() + i);
                const isT = sameDay(d, now);
                const tr = S.history.some(s => sameDay(s.date, d)) || (isT && ss && ss.order.length);
                week += `<div class="wd${isT ? ' today' : ''}${tr ? ' done' : ''}${d > now && !isT ? ' fut' : ''}"><span>${DOW[d.getDay()]}</span><b>${d.getDate()}</b><i></i></div>`;
            }

            const lastSame = S.history.find(s => s.planId === p.id);
            const stats = ss
                ? `<div><div class="v" id="h-time">00:00</div><div class="l">Tempo</div></div>
                   <div><div class="v">${sum(sv, e => e.sets.length)}/${totalSets}</div><div class="l">Séries</div></div>
                   <div><div class="v">${VOL(sum(sv, e => vol(e.sets))).replace(' ' + S.unit, '')}</div><div class="l">Vol (${S.unit})</div></div>
                   <div><div class="v" id="h-hr">${hrDev() ? Math.round(hrVal) : '—'}</div><div class="l">BPM</div></div>`
                : `<div><div class="v">${p.items.length}</div><div class="l">Exercícios</div></div>
                   <div><div class="v">${totalSets}</div><div class="l">Séries</div></div>
                   <div><div class="v">~${Math.round(totalSets * 2.6)}'</div><div class="l">Duração</div></div>
                   <div><div class="v">${lastSame ? ago(lastSame.date).replace('há ', '') : '—'}</div><div class="l">Última vez</div></div>`;

            const rows = p.items.map(it => {
                const k = exKey(it), e = ss && ss.ex[k];
                const meta = e ? e.sets.length + ' séries · ' + VOL(vol(e.sets)) : it.sets + ' × ' + it.reps + ' · ' + W(it.w);
                const end = e ? `<div class="st-ok">${I('check')}</div>` : it.mid ? `<div class="lend st-nfc">${I('nfc')}</div>` : '';
                return `<div class="lrow ri${e ? ' ok' : ''}" onclick="openEx('${k}')">${tile(it)}
                    <div class="lbody"><div class="lname">${exName(it)}${ss && it === next ? '<span class="chip acc">Próximo</span>' : ''}</div><div class="lmeta">${meta}</div></div>${end}</div>`;
            }).join('');
            const extras = ss ? ss.order.filter(k => !p.items.some(it => exKey(it) === k)).map(k => {
                const e = ss.ex[k];
                return `<div class="lrow ri ok" onclick="openEx('${k}')">${tile(e)}<div class="lbody"><div class="lname">${exName(e)}<span class="chip">Extra</span></div><div class="lmeta">${e.sets.length} séries · ${VOL(vol(e.sets))}</div></div><div class="st-ok">${I('check')}</div></div>`;
            }).join('') : '';

            const hd = hrDev();
            $('home-body').innerHTML = `
                <div class="phdr">
                    <div class="greeting">
                        <div class="g-sub">${DOWF[now.getDay()]}, ${now.getDate()} de ${MONF[now.getMonth()]}</div>
                        <h2>Bom treino, <span>${S.user.name}</span> 💪</h2>
                    </div>
                    <div class="avatar" onclick="nav('profile')">RS</div>
                </div>
                <div class="week">${week}</div>
                <div class="hero">
                    <div class="hero-top">
                        <div>
                            <div class="hero-lbl">${ss ? 'Treino em andamento' : S.todayPlanId ? 'Treino de hoje' : 'Próximo da rotação'}</div>
                            <div class="hero-title">${p.name}</div>
                            <div class="hero-sub">${p.focus || 'Sem exercícios'} · ${(progOf(p.id) || { name: '' }).name}</div>
                        </div>
                        <div class="ring"><svg viewBox="0 0 60 60"><circle class="rt" cx="30" cy="30" r="24"/><circle class="rp" cx="30" cy="30" r="24" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg><b>${doneN}/${p.items.length}</b></div>
                    </div>
                    <div class="hero-stats">${stats}</div>
                    <div class="hero-act">${ss
                    ? `<button class="btn bw" onclick="endSession()">${I('flag')}Encerrar treino</button><button class="btn bgl" onclick="nav('scan')">${I('nfc')}Escanear</button>`
                    : `<button class="btn bw" onclick="startSession()">${I('play')}Começar treino</button><button class="btn bgl" onclick="nav('plans')">Trocar treino</button>`}
                    </div>
                </div>
                <div class="ble-pill" onclick="nav('devices')">
                    <div class="ble-dot ${hd ? 'on' : 'off'}"></div>
                    <div><div class="t">${hd ? hd.name + ' conectado' : 'Nenhum monitor conectado'}</div><div class="s">${hd ? 'Monitor cardíaco · BLE' : 'Toque para conectar via BLE'}</div></div>
                    ${hd ? `<div class="ble-hr" id="home-hr">${Math.round(hrVal)} <small>bpm</small></div>` : `<div class="lend" style="margin-left:auto">${I('chev')}</div>`}
                </div>
                <div class="slabel">exercícios de hoje <small>${doneN} de ${p.items.length}</small></div>
                ${rows || extras ? `<div class="list">${rows}${extras}</div>`
                    : `<div class="empty"><div class="tile">${I('clipboard')}</div><b>${p.name} ainda está vazio</b>Adicione os exercícios e vincule às máquinas.</div><div class="br"><button class="btn bp" onclick="editPlan('${p.id}')">${I('plus')}Montar treino</button></div>`}`;
        }

        function startSession(silent) {
            if (S.session) return;
            const p = todayPlan();
            S.session = { start: Date.now(), planId: p.id, planName: p.name, focus: p.focus, hr: [], ex: {}, order: [] };
            if (!silent) toast('▶ Treino iniciado — escaneie a primeira máquina');
            renderHome();
        }

        function endSession() {
            const ss = S.session; if (!ss) return;
            if (!ss.order.length) { toast('⚠️ Registre ao menos um exercício'); return; }
            const hr = ss.hr.length ? ss.hr : [Math.round(hrVal)];
            S.summary = {
                id: 's' + ss.start, date: new Date(ss.start), dur: Math.max(1, Math.round((Date.now() - ss.start) / 60000)),
                planId: ss.planId, planName: ss.planName, focus: ss.focus,
                hrAvg: Math.round(sum(hr, v => v) / hr.length), hrMax: Math.max(...hr),
                exercises: ss.order.map(k => ss.ex[k])
            };
            S.summaryLive = true;
            nav('summary');
        }

        // ── NFC / MÁQUINA ────────────────────────────────────────
        function openEx(key) { loadEx(key); nav('scan'); }

        function loadEx(key) {
            const item = todayPlan().items.find(it => exKey(it) === key) || null;
            const mid = key.startsWith('free:') ? null : key;
            const prevEx = S.session && S.session.ex[key];
            if (!S.session) startSession(true);
            const sg = suggest(key, item), last = lastOf(key);
            const sets = prevEx
                ? prevEx.sets.map(s => ({ w: s.w, r: s.r, done: true }))
                : Array.from({ length: item ? item.sets : 3 }, () => ({ w: sg.w, r: item ? item.reps : 10, done: false }));
            S.current = {
                key, mid, name: mid ? M[mid].name : key.slice(5), cat: mid ? M[mid].cat : (item && item.cat) || 'core', item, sg, sets,
                effort: prevEx ? prevEx.effort : null,
                note: prevEx ? prevEx.note : (last && last.note) || ''   // a anotação da máquina acompanha o aluno
            };
            renderScan();
        }

        function renderScan() {
            const c = S.current, el = $('scan-body');
            $('scan-badge').textContent = c ? 'LIDO' : S.scanning ? 'LENDO' : 'AGUARDANDO';
            if (!c) {
                const nx = nextItem();
                el.innerHTML = `
                    <div class="slabel hint" style="margin-top:0">aproxime o celular da tag NFC da máquina</div>
                    <div class="scan-zone${S.scanning ? ' active' : ''}" onclick="startScan()">
                        <div class="sz-ring">${I('nfc')}</div>
                        <div class="sz-lbl">${S.scanning ? 'LENDO TAG NFC...' : 'TOQUE PARA LER TAG'}</div>
                        <div class="sz-hint">${S.scanning ? 'Mantenha o celular próximo' : 'Cada máquina tem sua tag NFC'}</div>
                    </div>
                    ${nx ? `<div class="slabel" style="margin-top:4px">próximo do plano</div>
                    <div class="list"><div class="lrow" onclick="openEx('${exKey(nx)}')">${tile(nx)}<div class="lbody"><div class="lname">${exName(nx)}</div><div class="lmeta">${nx.sets} × ${nx.reps} · ${W(nx.w)}</div></div>${nx.mid ? `<span class="tagchip">${I('nfc')}${M[nx.mid].tag}</span>` : '<span class="chip">Livre</span>'}</div></div>` : ''}
                    <div class="slabel">simular tag de outra máquina</div>
                    <div class="hscroll">${MACHINES.map(m => `<button class="mchip" onclick="simTag('${m.id}')">${tile(m)}${m.name}</button>`).join('')}</div>`;
                return;
            }
            const m = c.mid && M[c.mid], last = lastOf(c.key), pr = prBase(c.key), n = countOf(c.key);
            const lastTop = last ? Math.max(...last.sets.map(s => s.w)) : 0;
            el.innerHTML = `
                <div class="tagbar${m ? '' : ' free'}">${I(m ? 'check' : 'body')}
                    <div><b>${m ? 'Tag lida' : 'Exercício livre'}</b><span>${m ? m.tag + ' · ' + m.id : 'sem máquina vinculada'}</span></div>
                    <button class="linkbtn" onclick="resetScan()">Ler outra</button>
                </div>
                <div class="machine-card">
                    <div class="mc-top">
                        <div class="mc-ico">${I(exIco(c))}</div>
                        <div class="mc-info">
                            <div class="name">${c.name}</div>
                            <div class="muscle">${m ? m.muscle : CATS[c.cat].l}</div>
                            ${c.item ? `<span class="chip acc">No plano · ${c.item.sets} × ${c.item.reps} · ${W(c.item.w)}</span>` : '<span class="chip">Fora do plano de hoje</span>'}
                        </div>
                    </div>
                    <div class="mc-body">
                        <div class="mc-stat"><div class="v">${last ? Wn(lastTop) : '—'}</div><div class="l">Última carga</div><div class="delta">${last ? ago(last.date) : 'primeira vez'}</div></div>
                        <div class="mc-stat"><div class="v">${pr ? Wn(pr) : '—'}</div><div class="l">Recorde</div><div class="delta" style="color:#c9761a">🏆 PR</div></div>
                        <div class="mc-stat"><div class="v">${n}</div><div class="l">Sessões</div><div class="delta">total</div></div>
                    </div>
                    ${c.mid ? spark(c.key) : ''}
                </div>
                ${c.sg.w ? `<div class="sugg">${I('bolt')}<div>Sugestão de hoje: <b>${W(c.sg.w)}</b>${c.sg.up ? ` <span class="chip ${c.sg.up > 0 ? 'ok' : 'gold'}">${c.sg.up > 0 ? '+' : '−'}${W(Math.abs(c.sg.up))}</span>` : ''}<small>${c.sg.why}</small></div></div>` : ''}
                ${last ? `<div class="last-row"><span>Última vez:</span>${last.sets.map(s => `<span class="si-set${s.pr ? ' pr' : ''}">${Wn(s.w)}×${s.r}</span>`).join('')}${last.effort ? `<span class="chip">${EF[last.effort].e} ${EF[last.effort].l}</span>` : ''}</div>` : ''}
                <div class="slabel">séries de hoje <small>${S.unit} × reps</small></div>
                <div class="card" id="sets-list" style="padding:8px 14px"></div>
                <div class="add-set" onclick="addSet()">+ Adicionar série</div>
                <div class="slabel" style="margin-top:6px">como foi o esforço? <small>ajusta a próxima carga</small></div>
                <div class="effort" id="effort">${effortHTML()}</div>
                <div class="field"><input class="inp" placeholder="Anotação (ex.: banco no furo 3, pegada)" value="${c.note}" oninput="S.current.note=this.value"></div>
                <div class="br">
                    <button class="btn bp" onclick="finishExercise()">Finalizar Exercício</button>
                    <button class="btn bo sq" onclick="printExercise()" aria-label="Imprimir exercício">${I('printer')}</button>
                </div>`;
            renderSets();
        }

        function effortHTML() {
            return Object.entries(EF).map(([k, e]) => `<button class="${S.current.effort === k ? 'on' : ''}" onclick="setEffort('${k}')"><span>${e.e}</span><b>${e.l}</b><small>${e.d}</small></button>`).join('');
        }
        function setEffort(k) { S.current.effort = S.current.effort === k ? null : k; $('effort').innerHTML = effortHTML(); }

        // Mini gráfico das últimas sessões; toque abre a Evolução daquela máquina
        function spark(key) {
            const pts = S.history.filter(s => s.exercises.some(e => exKey(e) === key)).slice(0, 8).reverse()
                .map(s => Math.max(...s.exercises.find(e => exKey(e) === key).sets.map(x => x.w)));
            if (pts.length < 2) return '';
            const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
            const P = pts.map((w, i) => [4 + i * 132 / (pts.length - 1), 28 - (w - lo) / span * 22]);
            const d = pts[pts.length - 1] - pts[0];
            return `<div class="mc-prog" onclick="S.progKey='${key}';S.progTab='sum';nav('progress')">
                <div><b>Progressão</b><span>${pts.length} sessões</span></div>
                <svg viewBox="0 0 140 32" preserveAspectRatio="none"><polyline points="${P.map(p => p.join(',')).join(' ')}" fill="none" stroke="#6c3ce0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${P[P.length - 1][0]}" cy="${P[P.length - 1][1]}" r="3" fill="#c13cb4"/></svg>
                <div class="d" style="color:${d > 0 ? 'var(--gr)' : 'var(--mu)'}">${d > 0 ? '+' : ''}${fmt(toU(d))} ${S.unit}</div>
            </div>`;
        }

        function markPRs() {
            const c = S.current; let mx = prBase(c.key);
            const has = mx > 0;
            c.sets.forEach(s => { s.pr = s.done && has && s.w > mx; if (s.done && s.w > mx) mx = s.w; });
        }

        function renderSets() {
            markPRs();
            $('sets-list').innerHTML = S.current.sets.map((s, i) => `
                <div class="set-row${s.pr ? ' pr' : ''}">
                    <div class="set-num">${s.pr ? I('trophy') : 'S' + (i + 1)}</div>
                    <div class="set-inputs">
                        <input class="set-input" type="number" inputmode="decimal" value="${toU(s.w)}" placeholder="${S.unit}" onchange="updateSet(${i},'w',this.value)">
                        <div class="set-x">×</div>
                        <input class="set-input" type="number" inputmode="numeric" value="${s.r}" placeholder="reps" onchange="updateSet(${i},'r',this.value)">
                    </div>
                    <div class="set-done ${s.done ? 'ok' : ''}" onclick="toggleSetDone(${i})">${I('check')}</div>
                </div>`).join('');
        }

        function updateSet(i, k, v) {
            S.current.sets[i][k] = k === 'w' ? fromU(v) : Math.max(0, parseInt(v) || 0);
            if (S.current.sets[i].done) renderSets();
        }
        function toggleSetDone(i) {
            const s = S.current.sets[i];
            s.done = !s.done;
            renderSets();
            if (s.done) toast(s.pr ? '🏆 Novo recorde: ' + W(s.w) + '!' : '✅ Série ' + (i + 1) + ' concluída');
        }
        function addSet() {
            const sets = S.current.sets, last = sets[sets.length - 1] || { w: 0, r: 10 };
            sets.push({ w: last.w, r: last.r, done: false });
            renderSets();
        }

        function finishExercise() {
            const c = S.current; if (!c) return;
            const done = c.sets.filter(s => s.done);
            if (!done.length) { toast('⚠️ Marque ao menos uma série'); return; }
            const ss = S.session;
            ss.ex[c.key] = { mid: c.mid, name: c.name, cat: c.cat, sets: done.map(s => ({ w: s.w, r: s.r, pr: !!s.pr })), effort: c.effort, note: c.note.trim() };
            if (!ss.order.includes(c.key)) ss.order.push(c.key);
            toast('💾 ' + c.name + ' salvo — vol: ' + VOL(vol(done)));
            S.current = null;
            const nx = nextItem();
            setTimeout(() => {
                nav('home');
                setTimeout(() => toast(nx ? '➡️ Próximo: ' + exName(nx) : '🎉 Plano completo! Encerre o treino'), 1300);
            }, 400);
        }

        function resetScan() { S.current = null; S.scanning = false; renderScan(); }

        let scanTimer;
        function startScan() {
            if (S.current || S.scanning) return;
            const nx = nextItem();
            readTag(nx && nx.mid ? nx.mid : MACHINES[S.mIdx++ % MACHINES.length].id, 2200);
        }
        function simTag(mid) { if (!S.scanning) { $('s-scan').scrollTop = 0; readTag(mid, 1400); } }
        function readTag(mid, ms) {
            S.scanning = true; renderScan();
            clearTimeout(scanTimer);
            scanTimer = setTimeout(() => {
                const started = !S.session;
                S.scanning = false;
                loadEx(mid);
                toast((started ? '▶ Treino iniciado · ' : '✅ ') + M[mid].name + ' detectado via NFC');
            }, ms);
        }

        // ── RESUMO DO TREINO ────────────────────────────────────
        function renderSummary() {
            const o = S.summary, live = S.summaryLive; if (!o) return;
            const sets = sum(o.exercises, e => e.sets.length), v = sum(o.exercises, e => vol(e.sets));
            const prs = sum(o.exercises, e => e.sets.filter(s => s.pr).length);
            const prev = S.history.find(s => s.planId === o.planId && s.date < o.date && s.id !== o.id);
            const diff = prev ? Math.round((v - sum(prev.exercises, e => vol(e.sets))) / sum(prev.exercises, e => vol(e.sets)) * 100) : null;
            const z = zoneOf(o.hrAvg);
            $('sum-title').textContent = live ? 'Resumo do treino' : 'Treino';
            $('sum-body').innerHTML = `
                <div class="hero">
                    <div class="hero-top"><div>
                        <div class="hero-lbl">${live ? 'Treino concluído 🎉' : fdate(o.date) + ' · ' + hhmm(o.date)}</div>
                        <div class="hero-title">${o.planName}</div>
                        <div class="hero-sub">${o.focus}</div>
                    </div></div>
                    <div class="hero-stats">
                        <div><div class="v">${o.dur}'</div><div class="l">Duração</div></div>
                        <div><div class="v">${VOL(v).replace(' ' + S.unit, '')}</div><div class="l">Vol (${S.unit})</div></div>
                        <div><div class="v">${sets}</div><div class="l">Séries</div></div>
                        <div><div class="v">${prs}</div><div class="l">Recordes</div></div>
                    </div>
                    ${diff != null ? `<div class="hero-note">${diff >= 0 ? '▲' : '▼'} ${Math.abs(diff)}% de volume vs. ${prev.planName} de ${fdate(prev.date)}</div>` : ''}
                </div>
                <div class="card hrrow">
                    <div class="tile">${I('heart')}</div>
                    <div><b>${o.hrAvg}</b> <span>bpm média</span></div>
                    <div><b>${o.hrMax}</b> <span>bpm máx</span></div>
                    <div><b>${kcalOf(o)}</b> <span>kcal</span></div>
                    <span class="chip" style="color:${ZONES[z][2]}">Z${z + 1}</span>
                </div>
                <div class="slabel">exercícios <small>${o.exercises.length}</small></div>
                ${o.exercises.map(e => `
                <div class="card ex-card">
                    <div class="ex-top">${tile(e)}<div class="lbody"><div class="lname">${exName(e)}${e.effort ? `<span class="chip">${EF[e.effort].e} ${EF[e.effort].l}</span>` : ''}</div><div class="lmeta">${e.mid ? M[e.mid].tag : 'Exercício livre'}${e.note ? ' · ' + e.note : ''}</div></div><div class="ex-vol">${VOL(vol(e.sets))}</div></div>
                    <div class="si-sets">${e.sets.map(s => `<span class="si-set${s.pr ? ' pr' : ''}">${Wn(s.w)}×${s.r}${s.pr ? ' 🏆' : ''}</span>`).join('')}</div>
                </div>`).join('')}
                <div style="height:6px"></div>
                ${live ? `<div class="br"><button class="btn bp" onclick="saveSession()">${I('check')}Concluir e salvar</button></div>` : ''}
                <div class="br">
                    <button class="btn ${live ? 'bo' : 'bp'}" onclick="printSession()">${I('printer')}Imprimir comprovante</button>
                    <button class="btn bo sq" onclick="toast('📤 PDF salvo na galeria')" aria-label="Salvar PDF">${I('file')}</button>
                </div>`;
        }

        function saveSession() {
            S.history.unshift(S.summary);
            S.session = null; S.current = null; S.summaryLive = false;
            stack = [];
            toast('💾 Treino salvo no histórico');
            nav('home');
        }

        // ── COMPROVANTE ─────────────────────────────────────────
        function renderReceipt(o, kind) {
            const L = (a, b) => `<div class="rrow"><span>${a}</span><span>${b}</span></div>`;
            const v = sum(o.exercises, e => vol(e.sets)), sets = sum(o.exercises, e => e.sets.length);
            const prs = sum(o.exercises, e => e.sets.filter(s => s.pr).length), p = printer();
            let h = '<div class="rtear"></div><div class="rbody">'
                + '<div class="rc rb">GYMTAG</div>'
                + `<div class="rc rs">${GYM.name} · ${GYM.unit}</div>`
                + `<div class="rc rs">${kind === 'session' ? 'Comprovante de Treino' : 'Registro de Exercício'}</div>`
                + '<div class="rdv"></div>'
                + L('ALUNO', S.user.full.toUpperCase())
                + L('DATA', o.date.toLocaleDateString('pt-BR'))
                + L('HORA', hhmm(o.date))
                + (o.dur ? L('DURAÇÃO', o.dur + ' min') : '')
                + L('FC', o.hrAvg + (o.hrMax ? ' / ' + o.hrMax + ' máx' : '') + ' bpm')
                + (o.dur ? L('GASTO EST.', '~' + kcalOf(o) + ' kcal') : '')
                + L('TREINO', (o.planName + (o.focus ? ' · ' + o.focus : '')).toUpperCase())
                + '<div class="rdv"></div>';
            o.exercises.forEach(e => {
                h += `<div class="rb">${exName(e).toUpperCase()}</div>`
                    + `<div class="rs">${e.mid ? 'Tag: ' + M[e.mid].tag : 'Exercício livre'}</div>`
                    + e.sets.map((s, i) => L('SÉRIE ' + (i + 1) + (s.pr ? ' ★PR' : ''), (s.w ? fmt(toU(s.w)) + S.unit : 'PC') + ' × ' + s.r)).join('')
                    + L('SUBTOTAL', VOL(vol(e.sets)))
                    + (e.effort ? L('ESFORÇO', EF[e.effort].l.toUpperCase()) : '')
                    + (e.note ? `<div class="rs">OBS: ${e.note}</div>` : '')
                    + '<div class="rsp"></div>';
            });
            h += '<div class="rdv"></div>'
                + (kind === 'session' ? L('EXERCÍCIOS', o.exercises.length) : '')
                + L('SÉRIES', sets)
                + L('VOLUME TOTAL', VOL(v))
                + (prs ? L('RECORDES', prs) : '')
                + (kind === 'ex' ? L('RECORDE', W(Math.max(prBase(exKey(o.exercises[0])), ...o.exercises[0].sets.map(s => s.w)))) : '')
                + '<div class="rdv"></div>'
                + '<div class="rc rb" style="color:#6c3ce0">✓ TREINO REGISTRADO</div>'
                + `<div class="rc rs">${p ? p.name + ' · 58mm' : 'impressora não conectada'}</div>`
                + '</div><div class="rtear" style="transform:scaleY(-1)"></div>';
            $('rcpt-area').innerHTML = h;
            $('rcpt-badge').textContent = p ? p.model : 'OFF';
        }
        function printSession() { renderReceipt(S.summary, 'session'); nav('receipt'); }
        function printExercise() {
            const c = S.current; if (!c) return;
            const done = c.sets.filter(s => s.done);
            renderReceipt({
                date: new Date(), planName: c.item ? todayPlan().name : 'Avulso', focus: c.item ? todayPlan().focus : '', hrAvg: Math.round(hrVal),
                exercises: [{ mid: c.mid, name: c.name, cat: c.cat, sets: done.length ? done : c.sets }]
            }, 'ex');
            nav('receipt');
        }
        function printNow() {
            const p = printer();
            toast(p ? '🖨 Enviando para ' + p.name + '...' : '⚠️ Conecte a impressora em Perfil › Dispositivos');
        }

        // ── TREINOS (divisões) ───────────────────────────────────
        function progCard(g, tp) {
            const active = g.id === S.activeProg;
            return `<div class="card prog">
                <div class="lname" style="font-size:15px">${g.name}${active ? '<span class="chip solid">Ativa</span>' : ''}</div>
                <div class="lmeta">Divisão ${g.ids.map((_, i) => LETTERS[i]).join('')} · ${g.origin === 'gym' ? 'personal ' + GYM.coach : 'criada por você'} · em rotação</div>
                <div class="prog-list">${g.ids.map((id, i) => {
                const p = planOf(id);
                return `<div class="lrow" onclick="openPlan('${id}')">
                        <div class="pc-letter${g.origin === 'me' ? ' me' : ''}">${LETTERS[i]}</div>
                        <div class="lbody"><div class="lname">${p.focus || p.name}${id === tp.id ? '<span class="chip acc">Hoje</span>' : ''}</div>
                        <div class="lmeta">${p.items.length ? p.items.length + ' exercícios · ' + sum(p.items, it => it.sets) + ' séries' : 'Vazio · toque para montar'}</div></div>
                        <div class="lend">${I('chev')}</div>
                    </div>`;
            }).join('')}
                </div>
                <div class="prog-act">
                    ${active ? '' : `<button class="btn" onclick="useProg('${g.id}')">${I('check')}Usar esta divisão</button>`}
                    ${g.origin === 'gym'
                    ? `<button class="btn" onclick="dupProg('${g.id}')">${I('copy')}Duplicar e editar</button>`
                    : g.ids.length < LETTERS.length ? `<button class="btn" onclick="addWorkout('${g.id}')">${I('plus')}Treino ${LETTERS[g.ids.length]}</button>` : ''}
                </div>
            </div>`;
        }

        function renderPlans() {
            const tp = todayPlan(), isGym = S.planTab === 'gym';
            const gs = PROGRAMS.filter(g => g.origin === (isGym ? 'gym' : 'me'));
            $('plans-body').innerHTML = `
                <div class="seg">
                    <button class="${isGym ? 'on' : ''}" onclick="S.planTab='gym';renderPlans()">Da academia</button>
                    <button class="${isGym ? '' : 'on'}" onclick="S.planTab='me';renderPlans()">Meus treinos</button>
                </div>
                ${isGym ? `
                <div class="card gym-banner">
                    <div class="tile">${I('building')}</div>
                    <div class="lbody"><div class="lname">${GYM.name}</div><div class="lmeta">Fichas da personal ${GYM.coach} · sincronizado ${GYM.synced}</div></div>
                    <button class="icon-btn sm" onclick="syncGym()" aria-label="Sincronizar">${I('refresh')}</button>
                </div>` : gs.length ? '' : `
                <div class="empty"><div class="tile">${I('clipboard')}</div><b>Monte sua própria divisão</b>Escolha quantos treinos (A, AB, ABC ou ABCD), adicione os exercícios e vincule cada um a uma máquina pela tag NFC.</div>`}
                ${gs.map(g => progCard(g, tp)).join('')}
                ${isGym ? '' : `
                <div class="slabel">nova divisão <small>treinos em rotação</small></div>
                <div class="split-pick">${[1, 2, 3, 4].map(n => `<button onclick="newProg(${n})"><b>${LETTERS.slice(0, n)}</b><span>${n} treino${n > 1 ? 's' : ''}</span></button>`).join('')}</div>`}`;
        }

        function syncGym() { GYM.synced = 'agora'; toast('🔄 Fichas da academia atualizadas'); renderPlans(); }
        function newPlan() { S.planTab = 'me'; nav('plans'); renderPlans(); toast('Escolha a divisão: A, AB, ABC ou ABCD'); }
        function openPlan(id) { S.viewPlan = id; S.delArm = false; nav('plan'); }

        function useProg(gid) {
            S.activeProg = gid; S.todayPlanId = null;
            toast('🔁 ' + PROGRAMS.find(g => g.id === gid).name + ' agora é a divisão ativa');
            renderPlans();
        }

        function newProg(n) {
            const t = Date.now(), ids = [];
            for (let i = 0; i < n; i++) { ids.push('m' + t + i); PLANS.push({ id: 'm' + t + i, name: 'Treino ' + LETTERS[i], focus: '', origin: 'me', items: [] }); }
            let name = 'Minha divisão ' + LETTERS.slice(0, n), k = 2;
            while (PROGRAMS.some(g => g.name === name)) name = 'Minha divisão ' + LETTERS.slice(0, n) + ' ' + k++;
            PROGRAMS.push({ id: 'pg' + t, name, origin: 'me', ids });
            toast('✨ Divisão ' + LETTERS.slice(0, n) + ' criada — monte o Treino A');
            editPlan(ids[0]);
        }

        function addWorkout(gid) {
            const g = PROGRAMS.find(x => x.id === gid), id = 'm' + Date.now();
            PLANS.push({ id, name: 'Treino ' + LETTERS[g.ids.length], focus: '', origin: 'me', items: [] });
            g.ids.push(id);
            editPlan(id);
        }

        function dupProg(gid) {
            const g = PROGRAMS.find(x => x.id === gid), t = Date.now();
            const ids = g.ids.map((id, i) => {
                const c = JSON.parse(JSON.stringify(planOf(id)));
                c.id = 'm' + t + i; c.origin = 'me';
                PLANS.push(c);
                return c.id;
            });
            PROGRAMS.push({ id: 'pg' + t, name: g.name + ' (minha)', origin: 'me', ids });
            S.planTab = 'me';
            toast('📋 Divisão copiada para Meus treinos');
            if (TAB_OF[document.querySelector('.scr.on').id.slice(2)] === 'plans' && stack[stack.length - 1] !== 'plans') goBack(); else renderPlans();
        }

        function renderPlan() {
            const p = planOf(S.viewPlan); if (!p) return;
            const g = progOf(p.id), tp = todayPlan(), sets = sum(p.items, it => it.sets), linked = p.items.filter(it => it.mid).length;
            $('plan-title').textContent = p.name + (p.focus ? ' · ' + p.focus : '');
            $('plan-badge').textContent = p.origin === 'gym' ? 'ACADEMIA' : 'SEU TREINO';
            $('plan-body').innerHTML = `
                <div class="card">
                    <div class="lname" style="font-size:16px">${p.focus || 'Sem foco definido'}</div>
                    <div class="info-line">${p.origin === 'gym' ? I('building') + `Ficha da ${GYM.name} · personal ${GYM.coach}` : I('user') + 'Criado por você'}</div>
                    <div class="info-line">${I('refresh')}${g.name} · treino ${LETTERS[g.ids.indexOf(p.id)]} de ${g.ids.map((_, i) => LETTERS[i]).join('')}</div>
                    <div class="mini-stats">
                        <div><div class="v">${p.items.length}</div><div class="l">Exercícios</div></div>
                        <div><div class="v">${sets}</div><div class="l">Séries</div></div>
                        <div><div class="v">~${Math.round(sets * 2.6)}'</div><div class="l">Duração</div></div>
                        <div><div class="v">${linked}/${p.items.length}</div><div class="l">Com tag</div></div>
                    </div>
                </div>
                <div class="slabel">exercícios</div>
                ${p.items.length ? `<div class="list">${p.items.map(it => `
                    <div class="lrow" style="cursor:default">${tile(it)}
                        <div class="lbody"><div class="lname">${exName(it)}</div><div class="lmeta">${it.sets} × ${it.reps} · ${W(it.w)}</div></div>
                        ${it.mid ? `<span class="tagchip">${I('nfc')}${M[it.mid].tag.slice(-3)}</span>` : '<span class="chip">Sem máquina</span>'}
                    </div>`).join('')}
                </div>` : '<div class="empty-sm">Nenhum exercício ainda</div>'}
                <div style="height:4px"></div>
                ${p.items.length ? `<div class="br"><button class="btn bp" onclick="setToday('${p.id}')">${p.id === tp.id ? I('check') + 'É o treino de hoje' : I('play') + 'Treinar hoje'}</button></div>` : ''}
                <div class="br">${p.origin === 'gym'
                    ? `<button class="btn bo" onclick="dupProg('${g.id}')">${I('copy')}Duplicar divisão para editar</button>`
                    : `<button class="btn ${p.items.length ? 'bo' : 'bp'}" onclick="editPlan('${p.id}')">${I('edit')}${p.items.length ? 'Editar' : 'Montar treino'}</button>`}
                </div>
                ${p.origin === 'me' ? `<div class="br"><button class="btn bt" onclick="delPlan('${p.id}')">${S.delArm ? 'Toque de novo para excluir' : 'Excluir treino'}</button></div>` : ''}`;
        }

        function setToday(id) {
            const p = planOf(id);
            S.todayPlanId = id; S.activeProg = progOf(id).id;
            if (S.session) Object.assign(S.session, { planId: p.id, planName: p.name, focus: p.focus });
            toast('📅 ' + p.name + ' é o treino de hoje');
            stack = [];
            nav('home');
        }

        function delPlan(id) {
            if (!S.delArm) { S.delArm = true; renderPlan(); return; }
            const g = progOf(id);
            PLANS.splice(PLANS.findIndex(p => p.id === id), 1);
            g.ids.splice(g.ids.indexOf(id), 1);
            g.ids.forEach((pid, i) => { const p = planOf(pid); if (/^Treino [A-E]$/.test(p.name)) p.name = 'Treino ' + LETTERS[i]; });
            if (!g.ids.length) {
                PROGRAMS.splice(PROGRAMS.indexOf(g), 1);
                if (S.activeProg === g.id) S.activeProg = PROGRAMS[0].id;
            }
            if (S.todayPlanId === id) S.todayPlanId = null;
            toast('🗑 Treino excluído');
            goBack();
        }

        // ── CRIAR / EDITAR TREINO ────────────────────────────────
        function editPlan(id) { S.draft = JSON.parse(JSON.stringify(planOf(id))); nav('edit'); }

        function renderEdit() {
            const d = S.draft; if (!d) return;
            const g = progOf(d.id);
            $('edit-title').textContent = 'Editar ' + d.name;
            $('edit-body').innerHTML = `
                ${g ? `<div class="slabel hint" style="margin-top:0">${g.name} · treino ${LETTERS[g.ids.indexOf(d.id)]} de ${g.ids.map((_, i) => LETTERS[i]).join('')}</div>` : ''}
                <div class="field"><label>Nome</label><input class="inp" value="${d.name}" placeholder="Ex.: Treino A" oninput="S.draft.name=this.value"></div>
                <div class="field"><label>Foco</label><input class="inp" value="${d.focus}" placeholder="Ex.: Peito + Tríceps (vazio = automático)" oninput="S.draft.focus=this.value"></div>
                <div class="slabel">exercícios <small>${d.items.length}</small></div>
                ${d.items.map((it, i) => `
                <div class="card ed-item">
                    <div class="ed-top">${tile(it)}
                        <div class="lbody"><div class="lname">${exName(it)}</div><div class="lmeta">${it.mid ? M[it.mid].muscle : CATS[exCat(it)].l + ' · exercício livre'}</div></div>
                        <button class="icon-btn sm" onclick="edRemove(${i})" aria-label="Remover">${I('x')}</button>
