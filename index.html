<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protótipos</title>
  <style>
    :root { --bg:#f5f6fa; --card:#fff; --text:#1c1e26; --muted:#6b7080; --accent:#4f46e5; --border:#e3e5ee; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14151b; --card:#1d1f28; --text:#eceef5; --muted:#9a9fb2; --accent:#8b86ff; --border:#2c2f3c; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
    h1 { margin:0 0 4px; font-size: 2rem; }
    p.sub { margin:0 0 32px; color:var(--muted); }
    ul { list-style:none; margin:0; padding:0; display:grid; gap:12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    li a { display:block; padding:18px 20px; background:var(--card); border:1px solid var(--border); border-radius:12px;
           color:var(--text); text-decoration:none; font-weight:600; transition: transform .15s, border-color .15s, box-shadow .15s; }
    li a:hover { transform: translateY(-2px); border-color:var(--accent); box-shadow:0 6px 18px rgba(79,70,229,.15); }
    li a small { display:block; margin-top:4px; font-weight:400; color:var(--muted); }
    .vazio { color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Protótipos</h1>
    <p class="sub">Clique para abrir.</p>
    <ul>
<!-- LISTA:INICIO -->
      <li class="vazio">Nenhum protótipo ainda.</li>
<!-- LISTA:FIM -->
    </ul>
  </main>
</body>
</html>
